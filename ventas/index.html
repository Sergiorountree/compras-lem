async function vCaptura() {
  const sucs = sucs_().filter(s => !s.pos); const hoy = new Date(); const ayer = new Date(hoy.getTime() - 86400000).toISOString().slice(0, 10);
  pon(topbar('Captura manual de venta', 'Solo sucursales sin POS conectado a Postgres (The Wings). La venta es del día, sin IVA.') + '<div class="p-8">' + (sucs.length ? '<div class="bg-white rounded-xl shadow-card p-6" style="max-width:560px"><div class="space-y-4"><div><label class="lbl-sm">Sucursal</label><select class="inp" id="c_suc">' + sucs.map(s => '<option value="' + s.branch_id + '">' + esc(s.nombre) + '</option>').join('') + '</select></div><div class="grid grid-2" style="gap:12px"><div><label class="lbl-sm">Fecha</label><input class="inp num" type="date" id="c_fecha" value="' + ayer + '"></div><div><label class="lbl-sm">Venta sin IVA</label><input class="inp num" type="number" min="0" step="0.01" id="c_venta" placeholder="0.00"></div></div><div class="text-xs" id="c_err" style="color:#8C1F1B"></div><div class="flex justify-end"><button class="btn btn-primary" onclick="capturarVenta()">' + icon('check', 14) + 'Guardar venta</button></div></div></div>' : '<div class="msg-card">Todas tus sucursales tienen venta automática del POS. No hay nada que capturar a mano.</div>') + '</div>');
}
async function capturarVenta() { const d = { branch_id: Number($('c_suc').value), fecha: $('c_fecha').value, venta_sin_iva: Number($('c_venta').value) }; if (!d.fecha || !$('c_venta').value) { $('c_err').textContent = 'Indica la fecha y la venta.'; return; } try { await api('ven_capturar', d); toast('Venta guardada.'); $('c_venta').value = ''; $('c_err').textContent = ''; } catch (e) { if (e.negocio) $('c_err').textContent = e.message; else errorUI(e); } }

if (S.token) arrancar(); else vLogin();
</script>
</body>
</html>
