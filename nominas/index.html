<script type="module">
/* ── SQL Connect (Firebase → Postgres directo). Decisión 8/12-sep-2026: las pantallas ya no pasan
   por n8n para hablar con la base; n8n queda para correos y robots. La sesión de Firebase se abre
   con la MISMA credencial de Google del botón de entrada (signInWithCredential). ── */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDataConnect, mutationRef, executeMutation } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-data-connect.js";
const fbApp = initializeApp({"apiKey": "AIzaSyC1ycKtN1atpb1monWFIJqmR4X5vmpnNoo", "authDomain": "lem-erp.firebaseapp.com", "projectId": "lem-erp", "appId": "1:902179844288:web:e887a0886fa1188da2fd25"});
const fbAuth = getAuth(fbApp);
const dc = getDataConnect(fbApp, { connector: "api", location: "us-central1", service: "lem-api" });
let resolverListo; const listo = new Promise(r => { resolverListo = r; });
onAuthStateChanged(fbAuth, () => resolverListo());
window.LEMDC = {
  listo,
  usuario: () => fbAuth.currentUser,
  entrar: (idToken) => signInWithCredential(fbAuth, GoogleAuthProvider.credential(idToken)),
  salir: () => signOut(fbAuth).catch(() => {}),
  llamar: async (accion, datos) => {
    const r = await executeMutation(mutationRef(dc, "Accion", { accion, datos: JSON.stringify(datos || {}) }));
    return (r && r.data && r.data.r && r.data.r.r) || {};
  }
};

  d.lineas.forEach(l => { const c = porId[l.colaborador_id]; if (!c) return;
    h += '<tr><td><div class="font-medium text-sm">' + esc(l.nombre) + '</div><div class="text-11 text-gray-400">' + esc(l.puesto || '') + ' · ' + pesos(c.sueldo_diario) + '/día</div></td><td class="text-center num">' + (c.a || '—') + '</td><td class="text-center num"' + (c.fi ? ' style="color:#8C1F1B;font-weight:600"' : '') + '>' + (c.fi || '—') + '</td><td class="text-center num">' + (c.vac || '—') + '</td><td class="text-center num"' + (c.trabajo_domingo ? ' style="color:var(--lem);font-weight:600"' : '') + '>' + (c.trabajo_domingo ? '+25%' : '—') + '</td><td class="text-center num">' + (N(c.descanso_pagado) > 0 ? r1(c.descanso_pagado) : '—') + '</td><td class="text-center num font-medium">' + r1(c.dias_pagados) + '</td><td class="text-right num">' + pesos(c.monto_sueldo) + '</td>' +
      '<td class="text-right num"' + (c.pierde_bono && N(c.bono_semanal) > 0 ? ' style="color:#8C1F1B"' : '') + '>' + (N(c.bono_semanal) === 0 ? '—' : c.pierde_bono ? '<span title="Bono perdido por falta o permiso sin goce">$0 ✕</span>' : pesos(c.monto_bono)) + '</td>' +
      '<td class="text-right num">' + (N(c.horas_extras) === 0 ? '—' : N(c.monto_he) > 0 ? pesos(c.monto_he) : '<span title="Horas reportadas, pendientes de aprobar en Horas extras" style="color:#9A3412">' + c.horas_extras + 'h ⏳</span>') + '</td><td class="text-right num">' + (N(c.prima_vacacional) > 0 ? '<span title="Prima vacacional: ' + (c.dias_vac_lft || '') + ' días × 25 % · aniversario ' + fmtFecha(c.aniversario) + ' (' + (c.anios_antiguedad || '') + ' año(s))" style="color:var(--lem-dark);font-weight:600">' + pesos(c.prima_vacacional) + '</span>' : '—') + '</td><td class="text-right num">' + pesos(c.total) + '</td><td class="text-right num"' + (N(c.deducciones) > 0 ? ' style="color:#8C1F1B"' : '') + ' title="' + (N(c.deducciones) > 0 ? 'Fijas ' + pesos2(c.ded_fijas) + ' · Préstamo ' + pesos2(c.ded_prestamos) : '') + '">' + (N(c.deducciones) > 0 ? '-' + pesos2(c.deducciones) + (N(c.ded_prestamos) > 0 ? '<div class="text-10 text-gray-400" style="font-weight:400">préstamo ' + pesos2(c.ded_prestamos) + '</div>' : '') : '—') + '</td><td class="text-right num text-gray-500">' + (N(c.isr_semanal) > 0 ? pesos2(c.isr_semanal) : '—') + '</td><td class="text-right num font-semibold" style="color:var(--lem-dark)">' + pesos(c.neto) + '</td>' + (c.sin_pago ? '<td class="text-right num text-gray-400">—</td><td class="text-right num text-gray-400">—</td><td><span class="badge badge-revision" title="Sin datos de pago: captúralos en la ficha del colaborador">Sin datos</span></td>' : '<td class="text-right num">' + (N(c.spei) > 0 ? pesos2(c.spei) : '—') + '</td><td class="text-right num">' + (N(c.efectivo) > 0 ? pesos2(c.efectivo) : '—') + '</td><td><span class="badge ' + (c.forma_pago === 'banregio' ? 'badge-aprobada' : 'badge-borrador') + '">' + ({ banregio: 'Banregio', efectivo: 'Efectivo', sobre: 'Sobre' }[c.forma_pago] || c.forma_pago) + '</span></td>') + '</tr>'; });
  const tot = d.lineas.reduce((t, l) => { const c = porId[l.colaborador_id]; if (c) { t.neto += N(c.neto); t.spei += N(c.spei); t.efe += N(c.efectivo); t.sin += c.sin_pago ? 1 : 0; } return t; }, { neto: 0, spei: 0, efe: 0, sin: 0 });
  h += '<tr style="background:var(--bg);font-weight:600"><td colspan="14" class="text-right text-sm" style="padding-right:12px">Total sucursal' + (tot.sin ? ' <span class="text-xs text-gray-500" style="font-weight:400">(' + tot.sin + ' sin datos de pago)</span>' : '') + '</td><td class="text-right num" style="color:var(--lem-dark)">' + pesos2(tot.neto) + '</td><td class="text-right num">' + pesos2(tot.spei) + '</td><td class="text-right num">' + pesos2(tot.efe) + '</td><td></td></tr>';
  return h + '</tbody></table><div class="text-11 text-gray-400 mt-2">Dom +25% = prima dominical · Desc. = días de descanso pagados (proporcional a faltas) · Bono $0 ✕ = bono perdido por falta o permiso sin goce · SPEI = dispersión Banregio (SPEI fijo, o el neto si es menor) · Efectivo = neto − SPEI.</div>';
}
async function exportarNomina() {

    d.lineas.forEach(l => { const c = porId[l.colaborador_id]; if (!c) return; filas.push({ 'Sucursal': d.sucursal, 'Colaborador': l.nombre, 'Puesto': l.puesto || '', 'Asistencias': c.a, 'Faltas (FI)': c.fi, 'Vacaciones': c.vac, 'Permiso c/goce': c.pcgs, 'Permiso s/goce': c.psgs, 'Domingo trabajado': c.trabajo_domingo ? 'Sí (+25%)' : 'No', 'Descanso pagado (días)': r1(c.descanso_pagado), 'Días pagados': r1(c.dias_pagados), 'Sueldo diario': N(c.sueldo_diario), 'Monto sueldo': N(c.monto_sueldo), 'Bono semanal': N(c.bono_semanal), 'Bono pagado': N(c.monto_bono), 'Horas extras (h)': N(c.horas_extras), 'Monto horas extras': N(c.monto_he), 'Prima vacacional': N(c.prima_vacacional), 'Percepciones': N(c.total), 'Deducciones': N(c.deducciones), 'De las cuales préstamo': N(c.ded_prestamos), 'ISR retenido (ref.)': N(c.isr_semanal), 'Neto a pagar': N(c.neto), 'Dispersión SPEI': N(c.spei), 'Efectivo': N(c.efectivo), 'Forma de pago': c.sin_pago ? 'SIN DATOS' : ({ banregio: 'Banregio', efectivo: 'EFECTIVO', sobre: 'Sobre' }[c.forma_pago] || c.forma_pago || '') }); }); }
  const ws = XLSX.utils.json_to_sheet(filas); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Nomina'); XLSX.writeFile(wb, 'nomina_semanal_' + S.nomWeek + '.xlsx');

/* ── Reportes: comprobante de horario y días trabajados (para firma) ── */
function vReportes() {
  const sucs = tiendas(); if (!S.repBranch || !sucs.some(s => s.branch_id === S.repBranch)) S.repBranch = (sucs[0] || {}).branch_id; const semanas = []; for (let i = 0; i < 8; i++) { const l = addDays(S.perfil.semana_actual.lunes, -7 * i); semanas.push({ week_id: weekDe(l), lunes: l, label: 'Semana ' + weekDe(l) + ' · ' + fmtCorta(l) + ' – ' + fmtCorta(addDays(l, 6)) + (i === 0 ? ' (actual)' : '') }); }
  pon(topbar('Reportes', 'Comprobantes para firma de colaboradores') + '<div class="p-8"><div class="bg-white rounded-xl shadow-card p-6" style="max-width:680px"><h3 class="text-base font-medium mb-1">Comprobante de horario y días trabajados</h3><p class="text-sm text-gray-500 mb-5">Genera una hoja por sucursal con el horario semanal, los días trabajados y el total de horas, con espacio para que cada colaborador firme. Conforme a las disposiciones laborales vigentes.</p><div class="space-y-4"><div>' + lbl('Sucursal') + '<select class="inp" id="rep_suc">' + sucs.map(s => '<option value="' + s.branch_id + '"' + (s.branch_id === S.repBranch ? ' selected' : '') + '>' + esc(s.nombre) + '</option>').join('') + '</select></div><div>' + lbl('Semana') + '<select class="inp" id="rep_sem">' + semanas.map((s, i) => '<option value="' + i + '"' + (i === S.repIdx ? ' selected' : '') + '>' + s.label + '</option>').join('') + '</select></div><div class="flex justify-end"><button class="btn btn-primary" onclick="generarComprobante()">' + icon('file', 14) + 'Generar comprobante</button></div></div></div></div>');
  S.repSemanas = semanas;
}
function horasTurno(e, s) { if (!e || !s) return 0; const [h1, m1] = e.split(':').map(Number), [h2, m2] = s.split(':').map(Number); let mins = (h2 * 60 + m2) - (h1 * 60 + m1); if (mins <= 0) mins += 24 * 60; return Math.round(mins / 60 * 10) / 10; }
async function generarComprobante() {
  S.repBranch = Number($('rep_suc').value); S.repIdx = Number($('rep_sem').value); const sem = S.repSemanas[S.repIdx]; modal('<div class="msg-card">Preparando el comprobante…</div>', 900);
  try { const [hor, pre] = await Promise.all([api('nom_horario', { branch_id: S.repBranch, week_id: sem.week_id }), api('nom_semana', { branch_id: S.repBranch, week_id: sem.week_id })]); const suc = tiendas().find(s => s.branch_id === S.repBranch) || {}; const hayDatos = hor.existe || pre.existe;
    const porId = {}; (hor.lineas || []).forEach(l => { porId[l.colaborador_id] = { nombre: l.nombre, puesto: l.puesto, h: l.dias || {}, p: {} }; }); (pre.lineas || []).forEach(l => { porId[l.colaborador_id] = porId[l.colaborador_id] || { nombre: l.nombre, puesto: l.puesto, h: {}, p: {} }; porId[l.colaborador_id].p = l.dias || {}; });
    const filas = Object.values(porId).map(c => { const dias = []; let horas = 0, trab = 0; for (let k = 0; k < 7; k++) { const h = c.h[k], p = c.p[k]; let t = '—'; if (h && h.tipo === 'trabaja') { t = (h.entrada || '') + '-' + (h.salida || ''); horas += horasTurno(h.entrada, h.salida); trab++; } else if (h && h.tipo === 'descanso') t = 'D'; else if (h && h.tipo === 'vacaciones') t = 'VAC'; else if (h && h.tipo === 'pcgs') t = 'PCGS'; else if (h && h.tipo === 'psgs') t = 'PSGS'; else if (p && p.indicador) { t = p.indicador; if (p.indicador === 'A') { trab++; horas += 8; } } dias.push(t); } return { c, dias, horas, trab }; });
    modal('<div class="no-print flex items-center justify-between pb-4 mb-4" style="border-bottom:1px solid var(--border)"><div class="text-sm text-gray-500">Vista previa del comprobante</div><div class="flex gap-2"><button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button><button class="btn btn-primary" onclick="window.print()">' + icon('file', 14) + 'Imprimir / Guardar PDF</button></div></div>' +
      '<div class="hoja" style="padding:8px"><div class="flex items-center justify-between mb-6" style="border-bottom:2px solid #1A1A1A;padding-bottom:12px"><div><div style="font-size:20px;font-weight:700;letter-spacing:-0.02em">Grupo LEM</div><div style="font-size:13px;color:#555">Comprobante de horario y días laborados</div></div><div style="text-align:right;font-size:12px;color:#555"><div><strong>' + esc(suc.nombre || '') + '</strong> · ' + esc(empresaNombre(suc.empresa_id)) + '</div><div>Semana ' + esc(sem.week_id) + '</div><div>' + fmtFecha(sem.lunes) + ' al ' + fmtFecha(addDays(sem.lunes, 6)) + '</div></div></div>' +
      (!hayDatos ? '<div class="no-print" style="background:#FEF9E7;border:1px solid #E8C547;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#7A4B05">Esta semana aún no tiene horario ni pre-nómina capturada para ' + esc(suc.nombre || '') + ', por eso los días aparecen vacíos. Puedes imprimir la hoja en blanco para llenarla a mano, o elegir una semana con datos.</div>' : '') +
      '<table><thead><tr><th>Colaborador</th>' + DIAS.map((d, i) => '<th style="text-align:center;min-width:52px">' + d + '<br><span style="font-weight:400;color:#888">' + Number(addDays(sem.lunes, i).slice(8, 10)) + '</span></th>').join('') + '<th style="text-align:center">Días</th><th style="text-align:center">Total hrs</th><th style="min-width:160px">Firma</th></tr></thead><tbody>' + filas.map(f => '<tr><td><div style="font-weight:600">' + esc(f.c.nombre) + '</div><div style="font-size:9px;color:#888">' + esc(f.c.puesto || '') + '</div></td>' + f.dias.map(d => '<td style="text-align:center;font-size:9.5px">' + esc(d) + '</td>').join('') + '<td style="text-align:center;font-weight:600">' + (f.trab || '—') + '</td><td style="text-align:center;font-weight:600">' + (f.horas || '—') + '</td><td style="height:38px"></td></tr>').join('') + '</tbody></table>' +
      '<div style="font-size:9.5px;color:#777;margin-top:10px">A = Asistencia · D = Descanso · FI = Falta injustificada · INC = Incapacidad · VAC = Vacaciones · PSGS / PCGS = Permisos. Las celdas con horario muestran entrada-salida.</div><div style="font-size:10.5px;color:#444;margin-top:18px;line-height:1.5;border-top:1px solid #ddd;padding-top:12px">Los colaboradores firmantes manifiestan estar de acuerdo con los horarios y días laborados registrados en el presente comprobante, correspondientes a la semana indicada.</div><div style="display:flex;justify-content:space-between;margin-top:40px;gap:40px"><div style="flex:1;text-align:center"><div style="border-top:1px solid #333;padding-top:6px;font-size:11px">Gerente de sucursal</div></div><div style="flex:1;text-align:center"><div style="border-top:1px solid #333;padding-top:6px;font-size:11px">Recursos Humanos</div></div></div></div>', 900);
  } catch (e) { cerrarModal(); errorUI(e); }
}
