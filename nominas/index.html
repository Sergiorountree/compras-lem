function apiForzada() { try { return localStorage.getItem('lem_api') || ''; } catch (e) { return ''; } }

async function esperarLEMDC() {
  if (!window.LEMDC) await new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if (window.LEMDC || Date.now() - t0 > 4000) { clearInterval(iv); r(); } }, 50); });
  if (window.LEMDC) await Promise.race([LEMDC.listo, new Promise(r => setTimeout(r, 4000))]);
}
function conEmpresa(datos) { const d = Object.assign({}, datos || {}); if (S.empresa && d.empresa_id == null) d.empresa_id = S.empresa; return d; }
async function api(accion, datos) {
  const d = conEmpresa(datos);
  if (!SOLO_N8N.has(accion) && apiForzada() !== 'n8n') {
    let listo = false;
    try {
      await esperarLEMDC();
      if (window.LEMDC && S.token) { const u = LEMDC.usuario(); const em = emailDeToken(S.token); if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token); }
      listo = !!(window.LEMDC && LEMDC.usuario());
    } catch (e) { console.warn('SQL Connect sin sesión (' + accion + '), usando n8n:', e && e.message); }
    if (listo) {
      try {
        const j = await LEMDC.llamar(accion, d);
        if (j && j.error && j.error !== 'no_existe') { const e = new Error(j.detalle || j.error); e.negocio = true; e.codigo = j.error; throw e; }
        return j;
      } catch (e) {
        if (e && e.negocio) throw e;
        if (!LECTURAS.has(accion)) { toast('No se pudo confirmar "' + accion + '" (' + ((e && e.message) || 'sin respuesta') + '). Revisa el estado antes de repetir.'); throw e; }
        console.warn('SQL Connect falló en la lectura ' + accion + ', usando n8n:', e && e.message);
      }

  }
  return apiN8n(accion, d);
}
async function apiN8n(accion, datos) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, accion, datos: datos || {} }) }); }
  catch (err) { toast('Sin conexión con la API (' + err.message + '). Revisa tu internet y reintenta.'); throw err; }
  if (r.status === 401) { store.del(); S.token = null; if (window.LEMDC) LEMDC.salir(); vLogin('Tu sesión expiró — vuelve a entrar.'); throw new Error('401'); }
  const j = await r.json();
  if (j.error && j.error !== 'no_existe') { const e = new Error(j.detalle || j.error); e.negocio = true; e.codigo = j.error; throw e; }
  return j;
}

}
function editable() { const d = S.semana; return !!(d && d.puede_capturar && vista() === 'gerente'); }
function countDays(l) { const c = { A: 0, D: 0, FI: 0, INC: 0, VAC: 0, PSGS: 0, PCGS: 0, BAJA: 0 }; for (let k = 0; k < 7; k++) { const i = l.dias && l.dias[k] && l.dias[k].indicador; if (i && c[i] !== undefined) c[i]++; } return c; }
function countsPill(l) { const c = countDays(l); const items = ['A', 'D', 'FI', 'INC', 'VAC', 'PSGS', 'PCGS'].filter(k => c[k]); if (!items.length) return '<span class="text-gray-300 text-xs">—</span>'; return '<div class="flex justify-center gap-15 flex-wrap">' + items.map(k => '<span class="text-10 num font-medium" style="color:' + IND_COLOR[k] + '">' + c[k] + k + '</span>').join('') + '</div>'; }
function progreso(lineas) { let t = lineas.length * 7, done = 0; lineas.forEach(l => { for (let k = 0; k < 7; k++) if (l.dias && l.dias[k] && l.dias[k].indicador) done++; }); return t ? Math.round(done / t * 100) : 0; }
function validar(lineas) {
  const bloqueantes = [], advertencias = []; let faltan = 0, fiSin = 0, incSin = 0;
  lineas.forEach(l => { let hasFI = false, hasINC = false, hasD = false, a = 0, cap = 0;
    for (let k = 0; k < 7; k++) { const i = l.dias && l.dias[k] && l.dias[k].indicador; if (!i) faltan++; else cap++; if (i === 'FI') hasFI = true; if (i === 'INC') hasINC = true; if (i === 'D') hasD = true; if (i === 'A') a++; }
    if (hasFI && !(l.observacion || '').trim()) fiSin++; if (hasINC && !(l.documento || '').trim()) incSin++;
    const nm = partesNombre(l.nombre)[0]; if (a === 7) advertencias.push(nm + ': 7 días seguidos de A.'); if (!hasD && cap === 7) advertencias.push(nm + ': sin día de descanso.'); });
  if (faltan) bloqueantes.push('Faltan ' + faltan + ' celdas por capturar.'); if (fiSin) bloqueantes.push(fiSin + ' colaborador(es) con FI sin observación.'); if (incSin) advertencias.push(incSin + ' INC sin documento adjunto.');

        '<td class="text-right"><button class="op-btn' + (ap && sel === '1' ? ' on' : '') + '" onclick="aprobarHE(' + args + ',\'1\',' + i + ')">' + pesos2(m1) + '</button></td><td class="text-right"><button class="op-btn' + (ap && sel === '2' ? ' on' : '') + '" onclick="aprobarHE(' + args + ',\'2\',' + i + ')">' + pesos2(m2) + '</button></td>' +
        '<td><div class="flex items-center gap-15"><input type="number" min="0" step="0.01" placeholder="0.00" class="he-input num" style="width:96px;text-align:left;padding:6px 8px" id="m3_' + i + '" value="' + (sel === '3' && f.he_monto3 != null ? esc(f.he_monto3) : '') + '"><button class="op-btn sm' + (ap && sel === '3' ? ' on' : '') + '" onclick="aprobarHE(' + args + ',\'3\',' + i + ')">Usar</button></div></td>' +
        '<td class="text-center">' + (ap ? '<div class="flex flex-col items-center gap-1"><span class="badge badge-aprobada">Aprobada · Op ' + esc(sel) + '</span><button class="text-11 text-gray-500 underline" onclick="quitarHE(' + args + ')">Quitar</button></div>' : '<span class="badge badge-borrador">Pendiente</span>') + '</td><td class="text-sm text-gray-600">' + (f.observacion ? esc(f.observacion) : '<span class="text-gray-300">—</span>') + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  pon(h + '</div>');
}
async function aprobarHE(pid, colab, opcion, i) {
  let monto = null; if (opcion === '3') { monto = Number(($('m3_' + i) || {}).value); if (!monto || monto <= 0) { toast('Captura el monto de la opción 3.'); return; } }
  try { await api('nom_horas_extra', { prenomina_id: pid, colaborador_id: colab, aprobada: true, opcion, monto3: monto }); toast('Horas extras aprobadas.'); S.bandeja = null; S.nomDetalle = {}; router(); } catch (e) { errorUI(e); }
}
async function quitarHE(pid, colab) { try { await api('nom_horas_extra', { prenomina_id: pid, colaborador_id: colab, aprobada: false }); toast('Aprobación retirada.'); S.bandeja = null; S.nomDetalle = {}; router(); } catch (e) { errorUI(e); } }

window.addEventListener('beforeunload', () => { if (S.dirty && S.semana && editable()) { try { navigator.sendBeacon && guardar(false); } catch (e) {} } });
if (S.token) arrancar(); else vLogin();
</script>
