<style>
  :root { --lem:#534AB7; --lem-dark:#3C3489; --lem-light:#EEEDFE; --bg:#FAFAF7; --surface:#fff; --border:#E8E6DF; --border-strong:#D5D2C7; --text:#1A1A1A; --soft:#6B6B66; --faint:#9B9A92;
          --A:#2A5A0E; --D:#565550; --FI:#8C1F1B; --INC:#7A4B05; --VAC:#0F4471; --PSGS:#322787; --PCGS:#0E5A42; --BAJA:#1A1A1A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { background:var(--lem); color:#fff; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px; }
  header h1 a { color:#fff; text-decoration:none; opacity:.9; }
  .badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18); border-radius:99px; padding:4px 10px; font-size:12px; }
  .badge select { border:none; border-radius:6px; padding:2px 6px; font-size:12px; }
  header a.portal { color:#fff; text-decoration:none; font-size:12px; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:4px 9px; }
  .layout { display:flex; min-height:calc(100vh - 48px); }
  nav.side { width:220px; background:var(--surface); border-right:1px solid var(--border); padding:14px 10px; flex-shrink:0; }
  nav.side a { display:block; padding:9px 12px; border-radius:10px; color:var(--text); text-decoration:none; font-size:14px; margin-bottom:4px; }
  nav.side a.on, nav.side a:hover { background:var(--lem-light); color:var(--lem-dark); font-weight:700; }
  nav.side .sec { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); padding:14px 12px 6px; }
  main { flex:1; padding:18px 22px 60px; min-width:0; }
  h2 { font-size:22px; font-weight:800; margin-bottom:4px; } .sub { color:var(--soft); font-size:14px; margin-bottom:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .fila { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn { border:none; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer; background:var(--lem); color:#fff; }
  .btn.sec { background:#fff; color:var(--lem-dark); border:1px solid var(--border-strong); } .btn.ok { background:#0E5A42; } .btn.mal { background:#8C1F1B; } .btn.mini { padding:5px 9px; font-size:12px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  select, input[type=text], input[type=number] { border:1px solid var(--border-strong); border-radius:8px; padding:6px 8px; font-size:14px; background:#fff; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; background:#fff; } th, td { border-bottom:1px solid var(--border); padding:7px 8px; text-align:left; vertical-align:middle; }
  th { font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--soft); background:#F5F4EF; position:sticky; top:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tabla { overflow:auto; border:1px solid var(--border); border-radius:12px; }
  .est { display:inline-block; border-radius:99px; padding:3px 10px; font-size:12px; font-weight:700; }
  .est.borrador, .est.sin_capturar { background:#F1EFE8; color:#565550; } .est.enviada { background:#DEEBF8; color:#0F4471; } .est.rechazada { background:#FCE7E5; color:#8C1F1B; } .est.cerrada { background:#2C2C2A; color:#fff; }
  select.ind { width:74px; font-weight:800; color:#fff; text-align:center; border:none; }
  select.ind.v { background:#fff; color:var(--faint); border:1px dashed var(--border-strong); font-weight:400; }
  select.ind.A{background:var(--A)} select.ind.D{background:var(--D)} select.ind.FI{background:var(--FI)} select.ind.INC{background:var(--INC)} select.ind.VAC{background:var(--VAC)} select.ind.PSGS{background:var(--PSGS)} select.ind.PCGS{background:var(--PCGS)} select.ind.BAJA{background:var(--BAJA)}
  .pill { display:inline-block; border-radius:6px; padding:2px 7px; font-size:12px; font-weight:800; color:#fff; min-width:34px; text-align:center; }
  .pill.A{background:var(--A)} .pill.D{background:var(--D)} .pill.FI{background:var(--FI)} .pill.INC{background:var(--INC)} .pill.VAC{background:var(--VAC)} .pill.PSGS{background:var(--PSGS)} .pill.PCGS{background:var(--PCGS)} .pill.BAJA{background:var(--BAJA)} .pill.v{background:#eee;color:#999}
  .aviso { background:#fff3cd; border:1px solid #ffe08a; color:#664d03; border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  .malo { background:#FCE7E5; border-color:#f3b8b3; color:#8C1F1B; } .bueno { background:#E6F4EA; border-color:#b7dfc4; color:#0E5A42; }
  .login { text-align:center; padding-top:70px; } .login .ico { font-size:46px; } .login h2 { margin:10px 0 4px; } .login p { color:var(--soft); margin-bottom:20px; }
  .msg { text-align:center; color:var(--soft); padding:50px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; } .kpi b { font-size:22px; display:block; } .kpi span { color:var(--soft); font-size:12.5px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; } .chip { border:1px solid var(--border-strong); background:#fff; border-radius:99px; padding:5px 12px; font-size:13px; cursor:pointer; } .chip.on { background:var(--lem); color:#fff; border-color:var(--lem); }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--lem-light); }
  .leyenda { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--soft); margin:8px 0 12px; }
  @media (max-width:820px) { .layout { flex-direction:column; } nav.side { width:auto; display:flex; overflow:auto; padding:8px; border-right:none; border-bottom:1px solid var(--border); } nav.side .sec { display:none; } nav.side a { white-space:nowrap; } main { padding:14px; } }
</style>
</head>
<body>
<header>
  <h1><a href="/" title="Portal">⌂</a> 👥 Nóminas — Grupo LEM</h1>
  <div class="fila" id="hRight"></div>
</header>
<div class="layout"><nav class="side" id="menu" style="display:none"></nav><main id="app"><div class="msg">Cargando…</div></main></div>

<script type="module">
/* ── SQL Connect (Firebase → Postgres directo). Decisión 8/12-sep-2026: las pantallas ya no pasan
   por n8n para hablar con la base; n8n queda para correos y robots. La sesión de Firebase se abre
   con la MISMA credencial de Google del botón de entrada (signInWithCredential). ── */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDataConnect, mutationRef, executeMutation } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-data-connect.js";
const fbApp = initializeApp({"apiKey": "AIzaSyC1ycKtN1atpb1monWFIJqmR4X5vmpnNoo", "authDomain": "lem-erp.firebaseapp.com", "projectId": "lem-erp", "appId": "1:902179844288:web:e887a0886fa1188da2fd25"});
const fbAuth = getAuth(fbApp);
const dc = getDataConnect(fbApp, { connector: "api", location: "us-central1", service: "lem-api" });
let resolverListo; const listo = new Promise(r => { resolverListo = r; });
onAuthStateChanged(fbAuth, () => resolverListo());
window.LEMDC = {
  listo,
  usuario: () => fbAuth.currentUser,
  entrar: (idToken) => signInWithCredential(fbAuth, GoogleAuthProvider.credential(idToken)),
  salir: () => signOut(fbAuth).catch(() => {}),
  llamar: async (accion, datos) => {
    const r = await executeMutation(mutationRef(dc, "Accion", { accion, datos: JSON.stringify(datos || {}) }));
    return (r && r.data && r.data.r && r.data.r.r) || {};
  }
};
</script>
<script>
/* ── Nóminas fase 2 (entrega A, 12-sep-2026): captura del gerente, envío, bandeja y aprobación de
   contabilidad, horas extra. Misma puerta (Google + SQL Connect) y misma API que Compras/Inventarios. ── */
const CLIENT_ID = '902179844288-c4ppk03u5ss2vdqvl0chfoghhedi9ape.apps.googleusercontent.com';
const API = 'https://rountree.app.n8n.cloud/webhook/compras-api';
const store = { get(){ try { return sessionStorage.getItem('lem_tok'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem('lem_tok', v); } catch(e){} }, del(){ try { sessionStorage.removeItem('lem_tok'); } catch(e){} } };
const S = { token: store.get() || null, perfil: null, vista: (function(){ try { return localStorage.getItem('lem_vista_nom') || 'admin'; } catch(e){ return 'admin'; } })(),
            branch: null, week: null, semana: null, bandeja: null, filtroBandeja: 'pendientes', empresa: null, msgPend: null };
const $ = id => document.getElementById(id); const app = () => $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const money = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
const num = (n, d) => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('es-MX', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const IND = ['A', 'D', 'FI', 'INC', 'VAC', 'PSGS', 'PCGS', 'BAJA'];
const IND_NOMBRE = { A: 'Asistencia', D: 'Descanso', FI: 'Falta injustificada', INC: 'Incapacidad', VAC: 'Vacaciones', PSGS: 'Permiso sin goce', PCGS: 'Permiso con goce', BAJA: 'Baja' };
function fmtF(d) { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fmtCorta(d) { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return Number(p[2]) + ' ' + M[Number(p[1]) - 1]; }
function errorUI(e) { if (!e || e.message === '401') return; console.error(e); aviso(e.negocio ? e.message : 'Algo falló: ' + (e.message || 'error desconocido'), 'malo'); }
function avisoLuego(t, cls) { S.msgPend = { t, cls }; }
function aviso(t, cls) { const d = document.createElement('div'); d.className = 'aviso ' + (cls || ''); d.textContent = t; app().prepend(d); setTimeout(() => d.remove(), 6000); }

/* ── API: SQL Connect con respaldo n8n (misma lógica que los otros módulos) ── */
const SOLO_N8N = new Set(['correo_oc']);
const LECTURAS = new Set(['perfil', 'nom_inicio', 'nom_semanas', 'nom_semana', 'nom_bandeja']);
function apiForzada() { try { return localStorage.getItem('lem_api') || ''; } catch (e) { return ''; } }
function emailDeToken(t) { try { return (JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || '').toLowerCase(); } catch (e) { return ''; } }
async function esperarLEMDC() {
  if (!window.LEMDC) await new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if (window.LEMDC || Date.now() - t0 > 4000) { clearInterval(iv); r(); } }, 50); });
  if (window.LEMDC) await Promise.race([LEMDC.listo, new Promise(r => setTimeout(r, 4000))]);
}
function conEmpresa(datos) { const d = Object.assign({}, datos || {}); if (S.empresa && d.empresa_id == null) d.empresa_id = S.empresa; return d; }
async function api(accion, datos) {
  const d = conEmpresa(datos);
  if (!SOLO_N8N.has(accion) && apiForzada() !== 'n8n') {
    let listo = false;
    try {
      await esperarLEMDC();
      if (window.LEMDC && S.token) { const u = LEMDC.usuario(); const em = emailDeToken(S.token); if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token); }
      listo = !!(window.LEMDC && LEMDC.usuario());
    } catch (e) { console.warn('SQL Connect sin sesión (' + accion + '), usando n8n:', e && e.message); }
    if (listo) {
      try {
        const j = await LEMDC.llamar(accion, d);
        if (j && j.error && j.error !== 'no_existe') { const e = new Error(j.detalle || j.error); e.negocio = true; e.codigo = j.error; throw e; }
        return j;
      } catch (e) {
        if (e && e.negocio) throw e;
        if (!LECTURAS.has(accion)) { aviso('No se pudo confirmar "' + accion + '" (' + ((e && e.message) || 'sin respuesta') + '). Revisa el estado antes de repetir.', 'malo'); throw e; }
        console.warn('SQL Connect falló en la lectura ' + accion + ', usando n8n:', e && e.message);
      }
    }
  }
  return apiN8n(accion, d);
}
async function apiN8n(accion, datos) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, accion, datos: datos || {} }) }); }
  catch (err) { aviso('Sin conexión con la API (' + err.message + '). Revisa tu internet y reintenta.', 'malo'); throw err; }
  if (r.status === 401) { store.del(); S.token = null; if (window.LEMDC) LEMDC.salir(); vLogin('Tu sesión expiró — vuelve a entrar.'); throw new Error('401'); }
  const j = await r.json();
  if (j.error && j.error !== 'no_existe') { const e = new Error(j.detalle || j.error); e.negocio = true; e.codigo = j.error; throw e; }
  return j;
}

/* ── Login ── */
function vLogin(msj) {
  $('menu').style.display = 'none'; $('hRight').innerHTML = '';
  app().innerHTML = '<div class="login"><div class="ico">👥</div><h2>Nóminas — Grupo LEM</h2><p>' + esc(msj || 'Entra con tu cuenta @grupolem.com') + '</p><div id="gbtn" style="display:flex;justify-content:center"></div></div>';
  if (window.google) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true,
      error_callback: (e) => aviso('Google no pudo abrir la ventana de acceso (' + ((e && e.type) || 'desconocido') + '). Permite ventanas emergentes para este sitio y reintenta.', 'malo'),
      callback: (resp) => { try { S.token = resp.credential; store.set(S.token); arrancar(); } catch (err) { aviso('Falló el arranque tras el login: ' + err.message, 'malo'); } } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es' });
  } else { setTimeout(() => vLogin(msj), 400); }
}
async function arrancar() {
  app().innerHTML = '<div class="msg">Cargando…</div>';
  try {
    const p = await api('nom_inicio');
    S.perfil = p; fijarEmpresa();
    const sucs = sucs_();
    if (!S.branch || !sucs.some(s => s.branch_id === S.branch)) S.branch = (sucs[0] || {}).branch_id || null;
    if (!S.week) S.week = p.semana_actual.week_id;
    pintarHeader(); pintarMenu(); router();
  } catch (e) {
    if (e.message !== '401') { if (e.codigo === 'sin_acceso') { $('menu').style.display = 'none'; app().innerHTML = '<div class="msg">Tu usuario no tiene acceso al módulo de Nóminas.<br><a href="/">Volver a los módulos</a></div>'; } else aviso('No se pudo cargar tu perfil: ' + e.message, 'malo'); }
  }
}
function salir() { store.del(); S.token = null; if (window.LEMDC) LEMDC.salir(); vLogin('Sesión cerrada.'); }

/* ── Empresa, roles y vista ── */
function fijarEmpresa() {
  const emps = (S.perfil && S.perfil.empresas) || [];
  if (emps.length <= 1) { S.empresa = null; return; }
  let e = null; try { e = Number(localStorage.getItem('lem_empresa')) || null; } catch (x) {}
  if (!emps.some(x => x.empresa_id === e)) e = emps[0].empresa_id;
  S.empresa = e;
}
function empresaActual() { const emps = S.perfil.empresas || []; return emps.find(e => e.empresa_id === S.empresa) || emps[0] || { roles: [] }; }
function rolesReales() { return empresaActual().roles || []; }
function esAdminReal() { return rolesReales().includes('admin'); }
function vista() { if (!esAdminReal()) return rolesReales().includes('contabilidad') ? 'contabilidad' : rolesReales().includes('gerente') ? 'gerente' : rolesReales().includes('asesor') ? 'asesor' : 'rh'; return S.vista; }
function veSueldos() { return vista() === 'admin' || vista() === 'contabilidad'; }
function sucs_() { return (S.perfil.sucursales || []).filter(s => !S.empresa || s.empresa_id === S.empresa); }
function sucsCaptura() { return sucs_().filter(s => s.captura); }
function irRuta(r) { if ((location.hash || '#inicio') !== '#' + r) location.hash = r; else { pintarMenu(); router(); } }
function cambiarVista(v) { S.vista = v; try { localStorage.setItem('lem_vista_nom', v); } catch (e) {} pintarHeader(); irRuta('inicio'); }
function cambiarEmpresa(v) { S.empresa = Number(v); try { localStorage.setItem('lem_empresa', String(S.empresa)); } catch (e) {} S.branch = (sucs_()[0] || {}).branch_id || null; S.semana = null; S.bandeja = null; pintarHeader(); irRuta((location.hash || '#inicio').replace('#', '').split('/')[0]); }
function pintarHeader() {
  const p = S.perfil; let h = '';
  const rolTxt = { admin: '◆ Administrador', contabilidad: '▲ Contabilidad', gerente: '✦ Gerente', asesor: '■ Asesor', rh: '● RH' }[vista()] || vista();
  h += '<span class="badge">' + rolTxt + '</span>';
  if (esAdminReal()) { const op = (v, t) => '<option value="' + v + '"' + (S.vista === v ? ' selected' : '') + '>' + t + '</option>';
    h += '<span class="badge">Ver como <select onchange="cambiarVista(this.value)">' + op('admin', 'Administrador') + op('gerente', 'Gerente de sucursal') + op('contabilidad', 'Contabilidad') + '</select></span>'; }
  const emps = p.empresas || [];
  if (emps.length > 1) h += '<span class="badge">Empresa <select onchange="cambiarEmpresa(this.value)">' + emps.map(e => '<option value="' + e.empresa_id + '"' + (e.empresa_id === S.empresa ? ' selected' : '') + '>' + esc(e.nombre) + '</option>').join('') + '</select></span>';
  h += '<span class="badge" style="opacity:.85">' + esc(p.usuario) + '</span><a class="portal" href="/">Portal</a><a class="portal" href="#" onclick="salir();return false">Salir</a>';
  $('hRight').innerHTML = h;
}
function pintarMenu() {
  const v = vista(); const cur = (location.hash || '#inicio').replace('#', '').split('/')[0];
  const it = (k, t) => '<a href="#' + k + '" class="' + (cur === k ? 'on' : '') + '">' + t + '</a>';
  let h = '<div class="sec">Menú</div>' + it('inicio', '🏠 Inicio');
  if (v === 'gerente' || v === 'admin') h += it('capturar', '📝 Capturar pre-nómina') + it('historial', '📅 Historial');
  if (v === 'contabilidad' || v === 'admin') h += it('bandeja', '📥 Bandeja pre-nóminas') + it('nomina', '💵 Nómina semanal');
  if (v === 'asesor') h += it('historial', '📅 Pre-nóminas');
  $('menu').innerHTML = h; $('menu').style.display = '';
}

/* ── Router ── */
window.addEventListener('hashchange', () => { if (S.perfil) { pintarMenu(); router(); } });
function router() {
  const parts = (location.hash || '#inicio').replace('#', '').split('/'); const r = parts[0];
  const v = r === 'capturar' ? vCapturar(parts[1], parts[2]) : r === 'historial' ? vHistorial() : r === 'bandeja' ? vBandeja(parts[1]) : r === 'nomina' ? vNomina() : vInicio();
  Promise.resolve(v).then(() => { if (S.msgPend) { aviso(S.msgPend.t, S.msgPend.cls); S.msgPend = null; } }).catch(e => { if (e && e.message === '401') return; const m = app().querySelector('.msg'); if (m) m.innerHTML = 'No se pudo cargar la pantalla.<br><a href="#inicio">Volver al inicio</a>'; aviso((e && e.negocio ? '' : 'No se pudo cargar: ') + ((e && e.message) || 'error desconocido'), 'malo'); console.error(e); });
}

/* ── Inicio ── */
async function vInicio() {
  const p = S.perfil; const sa = p.semana_actual;
  let h = '<h2>Semana ' + esc(sa.week_id) + '</h2><div class="sub">' + fmtCorta(sa.lunes) + ' – ' + fmtCorta(sa.domingo) + ' · ' + esc(empresaActual().nombre || '') + '</div>';
  if (vista() === 'gerente' || vista() === 'admin') {
    const sucs = sucsCaptura();
    if (!sucs.length) h += '<div class="aviso">Tu usuario no tiene sucursal para capturar.</div>';
    else {
      app().innerHTML = h + '<div class="msg">Cargando semanas…</div>';
      const cards = [];
      for (const s of sucs.slice(0, 20)) {
        const r = await api('nom_semanas', { branch_id: s.branch_id, n: 2 });
        const act = r.semanas[0], ant = r.semanas[1];
        cards.push('<div class="kpi"><span>' + esc(s.nombre) + '</span><div style="margin:8px 0 4px">Esta semana: <span class="est ' + act.estado + '">' + estadoTxt(act.estado) + '</span></div><div>Anterior: <span class="est ' + ant.estado + '">' + estadoTxt(ant.estado) + '</span></div>' +
          (act.motivo_rechazo ? '<div class="aviso malo" style="margin-top:8px">Rechazada: ' + esc(act.motivo_rechazo) + '</div>' : '') +
          '<div style="margin-top:10px"><a class="btn mini" href="#capturar/' + s.branch_id + '/' + act.week_id + '">Capturar esta semana →</a></div></div>');
      }

  const d = await api('nom_semana', { branch_id: S.branch, week_id: S.week }); S.semana = d;
  let h = '<h2>Nómina semanal</h2><div class="card"><div class="fila"><select onchange="S.branch=Number(this.value);vNomina()">' + sucs.map(s => '<option value="' + s.branch_id + '"' + (s.branch_id === S.branch ? ' selected' : '') + '>' + esc(s.nombre) + '</option>').join('') + '</select>' +
    '<button class="btn sec mini" onclick="S.week=weekDe(semanaVecina(S.week,-1));vNomina()">◀</button><b>Semana ' + esc(d.week_id) + ' · ' + fmtCorta(d.lunes) + ' – ' + fmtCorta(d.domingo) + '</b><button class="btn sec mini" onclick="S.week=weekDe(semanaVecina(S.week,1));vNomina()">▶</button><span class="est ' + d.estado + '">' + estadoTxt(d.estado) + '</span></div></div>';
  h += d.existe ? tablaCalculo(d, false) : '<div class="aviso">Esta semana no tiene pre-nómina capturada.</div>';
  app().innerHTML = h;
}
function exportar() {
  const d = S.semana; if (!d || !d.calculo) return;
  const porId = Object.fromEntries(d.calculo.map(c => [c.colaborador_id, c]));
  const filas = d.lineas.map(l => { const c = porId[l.colaborador_id] || {}; return { 'Sucursal': d.sucursal, 'Colaborador': l.nombre, 'Puesto': l.puesto || '', 'Asistencias': c.a, 'Faltas (FI)': c.fi, 'P.Vacac': c.vac, 'Permiso c/goce': c.pcgs, 'Permiso s/goce': c.psgs,
    'Domingo trabajado': c.trabajo_domingo ? 'Sí (+25%)' : 'No', 'Descanso pagado (días)': c.descanso_pagado, 'Días pagados': c.dias_pagados, 'Sueldo diario': c.sueldo_diario, 'Monto sueldo': c.monto_sueldo, 'Bono semanal': c.bono_semanal, 'Bono pagado': c.monto_bono,
    'Horas extras (h)': c.horas_extras, 'Monto horas extras': c.monto_he, 'Percepciones': c.total, 'Deducciones': c.deducciones, 'Neto a pagar': c.neto }; });
  const ws = XLSX.utils.json_to_sheet(filas); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Periodo');
  XLSX.writeFile(wb, 'nomina_' + (d.sucursal || '').replace(/[^A-Za-z0-9]+/g, '_') + '_' + d.week_id + '.xlsx');
}

if (S.token) arrancar(); else vLogin();
