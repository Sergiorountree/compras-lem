<div id="toast"></div>

<script>
/* Si la conexión (SQL Connect / Firebase) no carga —sin internet, bloqueador de contenido—, la pantalla lo dice en lugar de
   quedarse en "Cargando…". Contabilidad no tiene otro camino: no usa el respaldo de n8n. */
setTimeout(function () {
  if (document.documentElement.getAttribute('data-conta') === 'ok') return;
  var r = document.getElementById('root');
  if (r) r.innerHTML = '<div class="login-wrap"><div class="login-box" style="max-width:420px;text-align:center"><div class="font-serif text-xl mb-2">No cargó la conexión</div>' +
    '<p class="text-sm text-gray-500">No se pudo cargar SQL Connect (Firebase). Revisa tu internet o el bloqueador de contenido y vuelve a cargar la página.</p>' +
    '<a class="btn btn-secondary mt-4" href="/">Volver a los módulos</a></div></div>';
}, 15000);
</script>

<script type="module">

/* ── Rutas: #inicio · #subir · #debemos · #debemos/<clave> · #ingresos · #cortes · #cortes/<branch_id> ·
   #conciliacion[/semana/AAAA-SS | /motor/AAAA-MM[/branch_id] | /resumen | /falta | /cambios] · #efectivo[/AAAA-MM | /historico/<pestaña>] ── */
const RUTAS = { inicio: vInicio, subir: vSubir, debemos: vDebemos, ingresos: vIngresos, cortes: vCortes, conciliacion: vConciliacion, efectivo: vEfectivo };
function ruta() {
  let h = (location.hash || '').replace(/^#/, ''); try { h = decodeURIComponent(h); } catch (e) {}
  const i = h.indexOf('/'); const r = i < 0 ? h : h.slice(0, i); const arg = i < 0 ? null : (h.slice(i + 1) || null);
  return RUTAS[r] ? { r, arg } : { r: 'inicio', arg: null };
}

let rutaAnterior = '';
window.addEventListener('hashchange', () => { if (S.inicio) router(); });
async function router() {
  if (!S.inicio) return;

  const clave = r + '/' + (arg || ''); if (clave !== rutaAnterior) { rutaAnterior = clave; arriba(); }
  try { await RUTAS[r](arg, vez); }
  catch (e) { if (vez !== S.vez || (e && e.obsoleto)) return; errorEnVista(e); }
}

}

/* ════════════════ Subir XML (mig. 093): Alan sube aquí los XML de las facturas; ya no se usa Drive ════════════════
   1. La pantalla revisa cada archivo ANTES de mandarlo (extensión .xml, 200 KB, UTF-8, sin caracteres nulos ni DOCTYPE, que parezca
      factura timbrada). Los PDF y demás archivos de una carpeta se ignoran.
   2. Manda los listos en paquetes de 25 a conta_xml_subir; si un paquete falla, lo parte a la mitad hasta llegar a un solo archivo
      (así se aísla un archivo que truena la llamada o un paquete demasiado grande). Pero si la conexión falla 3 veces seguidas, o la
      base truena 3 archivos seguidos con el mismo error, se detiene: es una falla de todo el sistema y partir no sirve; lo que no se
      mandó sigue en la lista. Los errores que detienen todo (sin acceso, falta el RFC de la empresa…) se muestran arriba.
   3. La base vuelve a revisar todo y guarda el XML idéntico; responde por archivo: aceptado, ya estaba o rechazado con su motivo.
   4. El historial (conta_xml_subidas) dice en qué va cada uno: cargada, pendiente (el robot la procesa cada 30 min de 7:00 a 22:00;
      lo de la noche, a las 6:15), en revisión o
      de mes cerrado. El contenido de los XML vive solo en memoria y se borra al terminar de mandarlo, al salir o al cambiar de empresa. */
const MAX_KB = 200, PAQUETE = 25;
const FATALES = new Set(['sin_acceso', 'solo_sql_connect', 'sin_bitacora', 'falta_rfc_empresa', 'demasiados_archivos', 'faltan_datos', 'accion_desconocida', 'sin_email']);
const TXT_FATAL = { accion_desconocida: 'La subida de XML todavía no está activa en la base: avisa a Sergio. Los archivos siguen en la lista.',
  sin_email: 'La base no recibió tu cuenta: sal y vuelve a entrar. Los archivos siguen en la lista.' };
const FALLAS_SEGUIDAS = 3, ESPERA_RED_MS = 2000;   // fallas iguales seguidas = falla de todo el sistema: se detiene en vez de partir
const RES_SUB = { aceptado: ['Aceptado', 'b-verde'], ya_estaba: ['Ya estaba', 'b-gris'], rechazado: ['Rechazado', 'b-rojo'], no_enviado: ['No se envió', 'b-ambar'] };
const EST_SUB = { cargada: ['Cargada', 'b-verde'], pendiente: ['Pendiente', 'b-ambar'], en_revision: ['En revisión', 'b-rojo'], mes_cerrado: ['Mes cerrado', 'b-gris'] };
const TIPO_CFDI = { I: 'Ingreso', E: 'Egreso (nota de crédito)', P: 'Pago (REP)', N: 'Nómina', T: 'Traslado' };
const kb = n => F1.format(Number(n) / 1024) + ' KB';
function nuevoLote() { const d = new Date(); const p = n => String(n).padStart(2, '0'); const r = new Uint8Array(3); crypto.getRandomValues(r);
  return 'L' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '-' + Array.from(r, b => b.toString(16).padStart(2, '0')).join(''); }
function cuentaSub() {
  const it = S.sub.items; const c = { listos: 0, omitidos: 0, porEnviar: 0, aceptado: 0, ya_estaba: 0, rechazado: 0, no_enviado: 0, conRes: 0 };
  for (const x of it) { if (x.previa === 'omitido') { c.omitidos++; continue; } c.listos++; if (x.res) { c.conRes++; c[x.res.resultado] = (c[x.res.resultado] || 0) + 1; } else c.porEnviar++; }
  return c;
}
async function vSubir(arg, vez) {

async function agregarArchivos(lista) {

    if (ep !== S.epoca) return;

    sub.items.push(it); nuevos++;

    if (!file.size) { it.motivo = 'Está vacío'; continue; }

}

function filtrarProveedores(d) {
  const q = sinAcentos(S.ui.q.trim());
  let l = (d.proveedores || []).filter(p => (!S.ui.soloSaldo || N(p.abierto) > 0) && (!q || sinAcentos(p.nombre).includes(q) || sinAcentos(p.rfc || '').includes(q)));
  const o = S.ui.orden;
  if (o === 'vencido') l = l.slice().sort((a, b) => N(b.vencido) - N(a.vencido) || N(b.abierto) - N(a.abierto));
  else if (o === 'facturado') l = l.slice().sort((a, b) => N(b.facturado) - N(a.facturado));
  else if (o === 'dias') l = l.slice().sort((a, b) => N(b.max_dias_vencido) - N(a.max_dias_vencido) || N(b.vencido) - N(a.vencido));

  return l;
}

  else if (k === 'mesCor') { if (arg && /^\d{4}-\d{2}$/.test(arg)) { S.ui.mesCor = arg; router(); } }
  else if (k === 'diasFiltro') { S.ui.diasFiltro = arg || 'revisar'; router(); }
  else if (k === 'baseVer') { const v = ($('fBase') || {}).value || ''; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { toast('Elige una fecha.'); return; } S.ui.base = v; router(); }
  else if (k === 'baseHoy') { S.ui.base = null; router(); }
  else if (k === 'ir') { if (arg && /^[a-z]+(\/[A-Za-z0-9 ._-]+)*$/.test(arg)) ir(arg); }
  else if (k === 'concEstado') { S.ui.concEstado = arg || null; router(); }
  else if (k === 'concDias') { const n = Number(arg); if ([7, 14, 30, 60].includes(n)) { S.ui.concDias = n; router(); } }
  else if (k === 'efeOrden') { S.ui.efeOrden = arg === 'hoja' ? 'hoja' : 'semana'; router(); }
}
async function actualizar() {
  const ep = S.epoca; S.cache.clear();
  try { const r = await api('conta_inicio', {}); if (ep !== S.epoca) return; S.inicio = r; S.empresa = r.empresa_id; }
  catch (e) { if (ep !== S.epoca || e.obsoleto) return; if (e.sesion || e.codigo === 'sin_acceso') { if (e.sesion) errorEnVista(e); else vSinAcceso(e.message); return; } errorEnVista(e); return; }
  pintarShell(); await router(); toast('Actualizado.');
}
function cambiarEmpresa(v) {
  const n = Number(v); if (!Number.isInteger(n)) return;
  if (S.sub.enviando || S.sub.leyendo) { toast('Espera a que termine la subida para cambiar de empresa.'); const s = $('selEmp'); if (s) s.value = String(S.empresa); return; }
  S.empresa = n; S.cache.clear(); S.tiendas = []; S.deb = null; S.ui = uiInicial(); S.sub = subInicial(); arrancar();
}

/* ── Arranque ── */
if (S.token) arrancar(); else { Conexion.salir(); vLogin(S.motivo); }
</script>
