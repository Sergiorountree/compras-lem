<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--or:#e07b00;--orl:#f9a825;--bg:#fff8f0;--card:#fff;--bdr:#f0d9b5;--txt:#2d1a00;--mut:#888;--red:#c0392b;--grn:#27ae60;--adm:#4a148c}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
nav{background:var(--or);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #0003;gap:8px;flex-wrap:wrap}
nav h1{font-size:.98rem;font-weight:700}
nav h1 a{color:#fff;text-decoration:none;margin-right:6px}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-badge{background:#fff3;border-radius:20px;padding:3px 10px;font-size:.76rem;white-space:nowrap}
.role-badge select{border:none;border-radius:6px;padding:2px 4px;font-size:.76rem}
.logout-btn{background:#fff2;border:1px solid #fff5;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.78rem;text-decoration:none}
.page{padding:14px;max-width:100%;margin:0 auto}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh}
.login-card{background:var(--card);border-radius:16px;padding:30px 26px;box-shadow:0 4px 24px #e07b0022;width:100%;max-width:360px;text-align:center}
.login-card .logo{font-size:2.6rem;margin-bottom:6px}
.login-card h2{color:var(--or);font-size:1.2rem;margin-bottom:4px}
.login-card p{color:var(--mut);font-size:.85rem;margin-bottom:14px}
.btn{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:600;transition:all .2s;text-decoration:none;display:inline-block;font-family:inherit}
.btn-or{background:var(--or);color:#fff}.btn-or:hover{background:#c96e00}
.btn-sec{background:#eee;color:#444}.btn-sec:hover{background:#ddd}
.btn-grn{background:var(--grn);color:#fff}.btn-grn:hover{background:#1e8449}
.btn-adm{background:var(--adm);color:#fff}.btn-adm:hover{background:#380a68}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs-bar{background:var(--bg);padding:9px 14px 0;position:sticky;top:45px;z-index:90}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:.84rem;background:#eee;color:#555;font-weight:600;transition:all .2s;font-family:inherit}
.tab.active{background:var(--or);color:#fff}
.tab.adm-tab.active{background:var(--adm)}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:7px}
.sec-header h2{font-size:1rem;font-weight:700}
.badge{border-radius:8px;padding:3px 11px;font-size:.78rem;font-weight:600}
.badge-or{background:var(--or);color:#fff}
.badge-date{background:var(--orl);color:#5a3800}
.badge-adm{background:var(--adm);color:#fff}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bdr);background:var(--card);margin-bottom:13px}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:700px}
thead th{background:var(--or);color:#fff;padding:8px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:5}
thead th:first-child{text-align:left;min-width:150px}
td{padding:6px 5px;border-bottom:1px solid var(--bdr);vertical-align:middle;text-align:center}
td:first-child{text-align:left;font-weight:500;white-space:nowrap}
tr:nth-child(even){background:#fff8f0}
tr.total-row td{background:var(--orl);font-weight:700}
.c-yellow{background:#fffde7 !important}
.c-green{background:#f1f8e9 !important}
.c-blue{background:#e3f2fd !important}
.c-calc{background:#fce4ec !important;font-weight:600;color:#880e4f}
.summary-section{margin-bottom:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:.78rem}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:14px;height:14px;border-radius:3px;border:1px solid #ccc}
.hist-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.hist-controls select,.hist-controls input[type=month],.hist-controls input[type=date]{padding:7px 9px;border-radius:8px;border:1px solid var(--bdr);font-size:.85rem;background:#fff;font-family:inherit}
.hist-entry{background:var(--card);border-radius:10px;border:1px solid var(--bdr);margin-bottom:11px;overflow:hidden}
.hist-hdr{background:var(--orl);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px;flex-wrap:wrap}
.hist-hdr h3{font-size:.9rem;font-weight:700;color:#5a3800}
.empty-state{text-align:center;color:var(--mut);padding:34px 20px;font-size:.9rem}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.adm-header{background:linear-gradient(135deg,var(--adm),#7b1fa2);color:#fff;border-radius:12px;padding:18px;margin-bottom:14px}
.adm-header h2{font-size:1.1rem;margin-bottom:3px}
.adm-header p{font-size:.82rem;opacity:.85}
.suc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:11px;margin-bottom:14px}
.suc-card{background:var(--card);border-radius:10px;border:1px solid var(--bdr);padding:13px;cursor:pointer;transition:all .2s}
.suc-card:hover,.suc-card.open{border-color:var(--or);box-shadow:0 2px 12px #e07b0022}
.suc-card h4{font-size:.9rem;font-weight:700;margin-bottom:5px}
.suc-card .sc-stat{font-size:.76rem;color:var(--mut)}
.suc-card .sc-total{font-size:1.1rem;font-weight:700;color:var(--or);margin-top:4px}
.cfg-box{background:var(--card);border-radius:12px;border:1px solid var(--bdr);padding:16px;margin-bottom:16px}
.cfg-box h3{font-size:.95rem;font-weight:700;margin-bottom:12px;color:var(--adm)}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:6px;font-size:.85rem}
.loading{text-align:center;padding:40px;color:var(--mut)}
.nota{background:#fff3e0;border-left:3px solid var(--or);padding:9px 12px;border-radius:6px;margin-bottom:12px;font-size:.83rem;color:#5d4037}
.aviso{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 14px}
.eff-tbl{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--bdr);margin-top:4px;min-width:0}
.eff-tbl td{padding:7px 10px;border:1px solid var(--bdr)}
@media(max-width:480px){thead th,td{padding:5px 3px;font-size:.76rem}}

<script type="module">
/* ── SQL Connect (Firebase → Postgres directo). Decisión 8/12-sep-2026: las pantallas ya no pasan
   por n8n para hablar con la base; n8n queda para correos y robots. La sesión de Firebase se abre
   con la MISMA credencial de Google del botón de entrada (signInWithCredential). ── */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDataConnect, mutationRef, executeMutation } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-data-connect.js";
const fbApp = initializeApp({"apiKey": "AIzaSyC1ycKtN1atpb1monWFIJqmR4X5vmpnNoo", "authDomain": "lem-erp.firebaseapp.com", "projectId": "lem-erp", "appId": "1:902179844288:web:e887a0886fa1188da2fd25"});
const fbAuth = getAuth(fbApp);
const dc = getDataConnect(fbApp, { connector: "api", location: "us-central1", service: "lem-api" });
let resolverListo; const listo = new Promise(r => { resolverListo = r; });
onAuthStateChanged(fbAuth, () => resolverListo());
window.LEMDC = {
  listo,
  usuario: () => fbAuth.currentUser,
  entrar: (idToken) => signInWithCredential(fbAuth, GoogleAuthProvider.credential(idToken)),
  salir: () => signOut(fbAuth).catch(() => {}),
  llamar: async (accion, datos) => {
    const r = await executeMutation(mutationRef(dc, "Accion", { accion, datos: JSON.stringify(datos || {}) }));
    return (r && r.data && r.data.r && r.data.r.r) || {};
  }
};
</script>
<script>
const CLIENT_ID = '902179844288-c4ppk03u5ss2vdqvl0chfoghhedi9ape.apps.googleusercontent.com';
const API = 'https://rountree.app.n8n.cloud/webhook/compras-api';
const APP_CAPTURA = 'https://inventariotota.grupolem.com/';
const $ = (id) => document.getElementById(id);
const app = () => $('app');
function aviso(m) { let b = $('avisoErr'); if (!b) { b = document.createElement('div'); b.id = 'avisoErr'; b.className = 'aviso'; document.body.insertBefore(b, $('app')); } b.textContent = '⚠️ ' + m; }
window.addEventListener('error', (e) => aviso('Error en la página: ' + e.message));
const store = { get(){ try { return sessionStorage.getItem('lem_tok'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem('lem_tok', v); } catch(e){} }, del(){ try { sessionStorage.removeItem('lem_tok'); } catch(e){} } };
const S = { token: store.get() || null, perfil: null, rol: null, branch: null, sucursales: [], tab: null,
  vista: (function(){ try { return localStorage.getItem('lem_vista_inv') || 'admin'; } catch(e){ return 'admin'; } })(), gerenteElegido: false,
  cache: {}, panelOpen: {}, filtroMes: '', filtroSuc: '', efMes: '', capSuc: null, capFecha: '' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const corto = (n) => String(n || '').replace(' Chihuahua', '');
function fmtDate(iso) { const p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function fmt(n) { if (n === null || n === undefined || n === '') return ''; const v = parseFloat(n); if (isNaN(v)) return ''; return v % 1 === 0 ? v : parseFloat(v.toFixed(3)); }
function num(v) { return parseFloat(v) || 0; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function effColor(v) { return v === null || v === undefined ? 'var(--mut)' : v >= 95 ? 'var(--grn)' : v >= 90 ? '#f9a825' : 'var(--red)'; }
const CATS = ['guiso', 'postre', 'bebida'], CAT_LABEL = { guiso: 'Guisos', postre: 'Postres', bebida: 'Bebidas' }, CAT_UNIT = { guiso: 'Kg', postre: 'PZAS', bebida: 'PZAS' }, CAT_ICON = { guiso: '🥩 Guisos', postre: '🍞 Postres', bebida: '🥤 Bebidas' };
function calcEffLines(lineas) {
  const c = { guiso: { vend: 0, cons: 0 }, postre: { vend: 0, cons: 0 }, bebida: { vend: 0, cons: 0 } };
  (lineas || []).forEach(l => { const k = l.categoria; if (!c[k]) return; const f = k === 'guiso' ? 1000 : 1; c[k].vend += num(l.dritzline) / f; c[k].cons += num(l.consumo_real) / f; });
  return c;
}
function effFromDia(d) {
  const c = { guiso: { vend: num(d.guisos_vend), cons: num(d.guisos_cons) }, postre: { vend: num(d.postre_vend), cons: num(d.postre_cons) }, bebida: { vend: num(d.bebida_vend), cons: num(d.bebida_cons) } };
  const e = {}; CATS.forEach(k => { e[k] = c[k].cons > 0 ? Math.round(c[k].vend / c[k].cons * 100) : null; }); return e;
}
function effHTML(c) {
  const cell = (x) => '<td>' + x + '</td>', row = (arr) => '<tr>' + arr.map(cell).join('') + '</tr>';
  return '<table class="eff-tbl">' +
    row(CATS.map(k => '<strong style="color:#2e7d32">Total ' + CAT_LABEL[k] + ' ' + CAT_UNIT[k] + ' vendidos</strong>')) +
    row(CATS.map(k => '<span style="font-size:1rem;font-weight:700;color:var(--or)">' + fmt(parseFloat(c[k].vend.toFixed(3))) + '</span> <span style="font-size:.72rem;color:var(--mut)">' + CAT_UNIT[k] + '</span>')) +
    row(CATS.map(k => '<strong style="color:#1565c0">Total ' + CAT_LABEL[k] + ' ' + CAT_UNIT[k] + ' Consumo</strong>')) +
    row(CATS.map(k => '<span style="font-size:1rem;font-weight:700;color:#1565c0">' + fmt(parseFloat(c[k].cons.toFixed(3))) + '</span> <span style="font-size:.72rem;color:var(--mut)">' + CAT_UNIT[k] + '</span>')) +
    row(CATS.map(k => '<strong style="color:#e65100">Diferencia ' + CAT_LABEL[k] + ' ' + CAT_UNIT[k] + '</strong>')) +
    row(CATS.map(k => { const dif = parseFloat((c[k].vend - c[k].cons).toFixed(3)); return '<span style="font-size:1rem;font-weight:700;color:' + (dif >= 0 ? 'var(--grn)' : 'var(--red)') + '">' + dif + '</span>'; })) +
    row(CATS.map(k => '<strong style="color:#6a1b9a">Eficiencia ' + CAT_LABEL[k] + '</strong>')) +
    row(CATS.map(k => { const eff = c[k].cons > 0 ? Math.round(c[k].vend / c[k].cons * 100) : null; return '<span style="font-size:1.3rem;font-weight:700;color:' + effColor(eff) + '">' + (eff !== null ? eff + '%' : '—') + '</span>'; })) +
    '</table>';
}

/* ── API ─────────────────────────────────────────────────
   Ruta principal: SQL Connect (window.LEMDC, ver módulo arriba). Respaldo: webhook de n8n, que
   además es la ÚNICA ruta para correo_oc (n8n manda el correo). Forzar n8n para diagnóstico:
   localStorage.setItem('lem_api', 'n8n'). ── */
const SOLO_N8N = new Set(['correo_oc']);
const LECTURAS = new Set(['perfil','catalogo','mis_requisiciones','bandeja','historial_asesor','detalle','ocs_por_recibir','por_pagar','calculadora','inv_dias','inv_dia','inv_resumen','inv_panel','inv_export','inv_config','admin_catalogo','admin_presupuestos','admin_calc_params','admin_calc_config']);
function apiForzada() { try { return localStorage.getItem('lem_api') || ''; } catch (e) { return ''; } }
function emailDeToken(t) { try { return (JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || '').toLowerCase(); } catch (e) { return ''; } }
async function esperarLEMDC() {
  if (!window.LEMDC) await new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if (window.LEMDC || Date.now() - t0 > 4000) { clearInterval(iv); r(); } }, 50); });
  if (window.LEMDC) await Promise.race([LEMDC.listo, new Promise(r => setTimeout(r, 4000))]);
}
async function api(accion, datos) {
  const d = conEmpresa(datos);
  if (!SOLO_N8N.has(accion) && apiForzada() !== 'n8n') {
    // 1) ¿Está lista la sesión de SQL Connect? Si no, se usa n8n (todavía no se mandó nada).
    let listo = false;
    try {
      await esperarLEMDC();
      if (window.LEMDC && S.token) {
        const u = LEMDC.usuario(); const em = emailDeToken(S.token);
        if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token);
      }
      listo = !!(window.LEMDC && LEMDC.usuario());
    } catch (e) { console.warn('SQL Connect sin sesión (' + accion + '), usando n8n:', e && e.message); }
    // 2) Ya con sesión: la llamada va por SQL Connect. Auditoría 12-sep (S04): una ESCRITURA que
    //    falla por red NO se repite por n8n (pudo haberse ejecutado); solo las lecturas caen a n8n.
    if (listo) {
      try {
        const j = await LEMDC.llamar(accion, d);
        if (j.error && j.error !== 'no_existe') { alert('⚠️ ' + (j.detalle || j.error)); const e = new Error(j.error); e.negocio = true; throw e; }
        return j;
      } catch (e) {
        if (e && e.negocio) throw e;
        if (!LECTURAS.has(accion)) {
          aviso('No se pudo confirmar "' + accion + '" (' + ((e && e.message) || 'sin respuesta') + '). Revisa el estado antes de volver a intentarlo.');
          throw e;
        }
        console.warn('SQL Connect falló en la lectura ' + accion + ', usando n8n:', e && e.message);
      }
    }
  }
  return apiN8n(accion, d);
}
async function apiN8n(accion, datos) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, accion, datos: datos || {} }) }); }
  catch (err) { aviso('Sin conexión con la API (' + err.message + '). Revisa tu internet y reintenta.'); throw err; }
  if (r.status === 401) { store.del(); S.token = null; if (window.LEMDC) LEMDC.salir(); vLogin('Tu sesión expiró — vuelve a entrar.'); throw new Error('401'); }
  const j = await r.json();
  if (j.error && j.error !== 'no_existe') { alert('⚠️ ' + (j.detalle || j.error)); throw new Error(j.error); }
  return j;
}

/* ── Login ─────────────────────────────────────────────── */
function vLogin(msj) {
  $('tabsBar').style.display = 'none'; $('navRight').innerHTML = '';
  app().innerHTML = '<div class="login-wrap"><div class="login-card"><div class="logo">🫓</div><h2>Grupo LEM — Gorditas</h2><p>Sistema de Inventario Diario</p><p>' + esc(msj || 'Entra con tu cuenta @grupolem.com') + '</p><div id="gbtn" style="display:flex;justify-content:center"></div></div></div>';
  if (window.google) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true,
      error_callback: (e) => aviso('Google no pudo abrir la ventana de acceso (' + ((e && e.type) || 'desconocido') + '). Permite ventanas emergentes para este sitio y reintenta.'),
      callback: (resp) => { try { S.token = resp.credential; store.set(S.token); arrancar(); } catch (err) { aviso('Falló el arranque tras el login: ' + err.message); } } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es' });
  } else { setTimeout(() => vLogin(msj), 400); }
}
async function arrancar() {
  try {
    const p = await api('perfil');
    S.perfil = p;
    const roles = (p.permisos || {}).inventarios || [];
    if (!roles.length) { app().innerHTML = '<div class="empty-state">Tu usuario no tiene acceso al módulo de Inventarios.<br><a href="/">Volver a los módulos</a></div>'; return; }
    S.rol = roles.includes('admin') ? 'admin' : roles.includes('aprobador') ? 'aprobador' : 'gerente';
    fijarEmpresa();
    if (!S.branch && S.sucursales.length) S.branch = S.sucursales[0].branch_id;
    pintarNav(); buildTabs(); router();
  } catch (e) { if (e.message !== '401') aviso('No se pudo cargar tu perfil: ' + e.message); }
}

/* ── Vista (solo admin) y navegación ───────────────────── */
function vista() { return S.rol === 'admin' ? S.vista : 'propia'; }
function esGerenteVista() { return vista() === 'gerente' || (vista() === 'propia' && S.rol === 'gerente'); }
function esAdminVista() { return vista() === 'admin' || (vista() === 'propia' && S.rol === 'admin'); }
function cambiarVista(v) {
  S.vista = v; S.gerenteElegido = false; try { localStorage.setItem('lem_vista_inv', v); } catch (e) {}
  if (v !== 'gerente' && S.sucursales.length) S.branch = S.sucursales[0].branch_id;
  S.tab = null; pintarNav(); buildTabs(); router();
}
function pintarNav() {
  const rolTxt = esGerenteVista() ? '👤 Gerente' : esAdminVista() ? '👑 Administrador' : '👁 Asesor';
  let h = '<span class="role-badge">' + rolTxt + (esGerenteVista() && S.branch ? ' — ' + esc(corto(sucNombre(S.branch))) : '') + '</span>';
  if (S.rol === 'admin') {
    const op = (v, t) => '<option value="' + v + '"' + (S.vista === v ? ' selected' : '') + '>' + t + '</option>';
    h += '<span class="role-badge">Ver como <select onchange="cambiarVista(this.value)">' + op('admin', 'Administrador') + op('gerente', 'Gerente de sucursal') + op('aprobador', 'Asesor') + '</select></span>';
  }
  h += selectorEmpresa();
  h += '<span class="role-badge" style="opacity:.8">' + esc(S.perfil.usuario) + '</span><a class="logout-btn" href="/">Portal</a>';
  $('navRight').innerHTML = h;
}
/* ── Multiempresa (11-sep-2026): selector solo si el usuario tiene más de una empresa ── */
function fijarEmpresa() {
  const p = S.perfil || {}; const emps = p.empresas || [];
  if (emps.length <= 1) { S.empresa = null; S.sucursales = p.sucursales || []; return; }
  let e = null; try { e = Number(localStorage.getItem('lem_empresa')) || null; } catch (x) {}
  if (!emps.some(x => x.empresa_id === e)) e = emps[0].empresa_id;
  S.empresa = e;
  S.sucursales = (p.sucursales || []).filter(s => s.empresa_id === S.empresa);
  if (!S.sucursales.some(s => s.branch_id === S.branch)) S.branch = (S.sucursales[0] || {}).branch_id || null;
}
function conEmpresa(datos) { const d = Object.assign({}, datos || {}); if (S.empresa && d.empresa_id == null) d.empresa_id = S.empresa; return d; }

/* ── Datos con caché ───────────────────────────────────── */
async function diasDe(branch, mes, dias) {
  const k = branch + '|' + (mes || ('d' + (dias || 60)));
  if (!S.cache[k]) S.cache[k] = (await api('inv_dias', { branch_id: branch, mes: mes || null, dias: dias || 60 })).dias;
  return S.cache[k];
}
async function diaDe(branch, fecha) {
  const k = 'dia|' + branch + '|' + fecha;
  if (!S.cache[k]) S.cache[k] = await api('inv_dia', { branch_id: branch, fecha });
  return S.cache[k];
}

/* ── Entrada de historial (colapsable, como la app) ────── */
function histEntry(d, branch) {
  const id = 'he_' + branch + '_' + d.fecha.replace(/-/g, '');

/* ── Eficiencias ───────────────────────────────────────── */
function buildEfHTML(dias, fm) {
  const rows = dias.map(d => Object.assign({ date: d.fecha }, { g: effFromDia(d).guiso, p: effFromDia(d).postre, b: effFromDia(d).bebida })).filter(r => r.g !== null || r.p !== null || r.b !== null);
  if (!rows.length) return '<div class="empty-state">No hay datos de eficiencia.</div>';
  const byMonth = {}; rows.forEach(r => { const m = r.date.substr(0, 7); (byMonth[m] = byMonth[m] || []).push(r); });
  let months = Object.keys(byMonth).sort((a, b) => b.localeCompare(a));
  if (fm) months = months.filter(m => m === fm);
  if (!months.length) return '<div class="empty-state">No hay datos para este período.</div>';
  const avg = (arr, key) => { const vals = arr.map(r => r[key]).filter(v => v !== null); return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null; };
  const fmtM = (m) => { const p = m.split('-'); const n = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic']; return n[parseInt(p[1]) - 1] + ' ' + p[0]; };
  const badge = (v) => v === null ? '—' : '<span style="font-weight:700;color:' + effColor(v) + '">' + v + '%</span>';
  const resumen = '<div class="tbl-wrap" style="margin-bottom:18px"><table style="min-width:400px"><thead><tr style="background:var(--adm)"><th style="background:var(--adm)">Mes</th><th style="background:var(--adm)">Prom. Guisos</th><th style="background:var(--adm)">Prom. Postres</th><th style="background:var(--adm)">Prom. Bebidas</th><th style="background:var(--adm)">Días</th></tr></thead><tbody>' +
    months.map(m => { const r = byMonth[m]; return '<tr><td style="font-weight:700">' + fmtM(m) + '</td><td>' + badge(avg(r, 'g')) + '</td><td>' + badge(avg(r, 'p')) + '</td><td>' + badge(avg(r, 'b')) + '</td><td style="color:var(--mut)">' + r.length + '</td></tr>'; }).join('') + '</tbody></table></div>';
  const detalle = months.map(m => { const r = byMonth[m];
    return '<div style="margin-bottom:20px"><h3 style="font-size:.95rem;font-weight:700;color:var(--adm);margin-bottom:8px">📅 ' + fmtM(m) + '</h3><div class="tbl-wrap"><table style="min-width:400px"><thead><tr><th>Fecha</th><th>Ef. Guisos</th><th>Ef. Postres</th><th>Ef. Bebidas</th></tr></thead><tbody>' +
      r.map(x => '<tr><td style="font-weight:600">' + fmtDate(x.date) + '</td><td>' + badge(x.g) + '</td><td>' + badge(x.p) + '</td><td>' + badge(x.b) + '</td></tr>').join('') +
      '</tbody><tfoot><tr style="background:var(--orl);font-weight:700"><td>PROMEDIO MES</td><td>' + badge(avg(r, 'g')) + '</td><td>' + badge(avg(r, 'p')) + '</td><td>' + badge(avg(r, 'b')) + '</td></tr></tfoot></table></div></div>'; }).join('');
  return '<h3 style="font-size:.95rem;font-weight:700;color:var(--adm);margin-bottom:10px">Cierre por Mes</h3>' + resumen + '<h3 style="font-size:.95rem;font-weight:700;color:var(--or);margin-bottom:10px">Detalle Diario</h3>' + detalle;
}

    '<div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><select id="admSucSelect" style="padding:8px 12px;border-radius:8px;border:1px solid var(--bdr);font-size:.9rem;background:#fff;max-width:260px"><option value="">-- Selecciona sucursal --</option>' +
    S.sucursales.map(s => '<option value="' + s.branch_id + '"' + (String(S.capSuc) === String(s.branch_id) ? ' selected' : '') + '>' + esc(corto(s.nombre)) + '</option>').join('') + '</select>' +
    '<input type="date" id="admDatePicker" value="' + esc(S.capFecha || todayStr()) + '" style="padding:8px 12px;border-radius:8px;border:1px solid var(--bdr);font-size:.9rem;background:#fff"><button class="btn btn-adm" onclick="S.capSuc=$(\'admSucSelect\').value;S.capFecha=$(\'admDatePicker\').value;vCapturar()">📂 Cargar</button></div>' +
    '<div style="background:#f3e5f5;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:.85rem;font-weight:600;color:var(--adm)">✏️ La captura de Saldo Inicial, Entrada y Dritzline se hace por ahora en la app:</span><a class="btn btn-adm" style="font-size:.78rem;padding:6px 10px" href="' + APP_CAPTURA + '" target="_blank" rel="noopener">Abrir app</a><span style="font-size:.76rem;color:#5d4037">Aquí ves lo que quedó guardado ese día.</span></div>';
  if (!S.capSuc) { app().innerHTML = h + '<div class="empty-state">Selecciona sucursal y fecha, y da clic en Cargar.</div>'; return; }
  app().innerHTML = h + '<div class="loading">Cargando…</div>';
  const d = await diaDe(Number(S.capSuc), S.capFecha);
  if (d.error) { app().innerHTML = h + '<div class="empty-state">No hay registro del ' + fmtDate(S.capFecha) + ' en esa sucursal.</div>'; return; }
  let rows = '';
  CATS.forEach(k => { const ls = d.lineas.filter(l => l.categoria === k); if (!ls.length) return;
    rows += '<tr><td colspan="5" style="background:var(--adm);color:#fff;font-weight:700;font-size:.82rem;padding:5px 8px;text-align:left">' + CAT_ICON[k] + '</td></tr>';
    ls.forEach(l => { rows += '<tr><td>' + esc(l.producto) + '</td><td>' + esc(l.unidad) + '</td><td class="c-blue">' + fmt(l.saldo_inicial) + '</td><td class="c-yellow">' + fmt(l.entradas) + '</td><td class="c-green">' + (l.dritzline != null ? fmt(l.dritzline) : '') + '</td></tr>'; }); });
  app().innerHTML = h + '<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Unidad</th><th style="background:#0d47a1">Saldo Inicial</th><th style="background:#f57f17">Entrada</th><th style="background:#1b5e20">Consumo Dritzline</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* La configuración (sucursales, productos, usuarios) vivirá en el panel central del portal para todos los módulos. */

/* ── Excel ─────────────────────────────────────────────── */
async function exportar(branch) {
  if (!window.XLSX) { alert('La librería de Excel no cargó; recarga la página.'); return; }
  const r = await api('inv_export', { branch_id: branch, mes: (branch ? S.filtroMes : S.filtroMes) || null });
  if (!r.filas.length) { alert('No hay datos'); return; }
  const hdr = ['Sucursal', 'Fecha', 'Producto', 'Unidad', 'Saldo Inicial', 'Entrada', 'Baño María', 'Refrigerador', 'Congelador', 'Saldo Final', 'Consumo Real', 'Dritzline', 'Df. Teórica', 'Diferencia (g)'];
  const ws = XLSX.utils.aoa_to_sheet([hdr].concat(r.filas)); ws['!cols'] = hdr.map(() => ({ wch: 14 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, (branch ? 'inventario_' + corto(sucNombre(branch)).replace(/\s+/g, '_') : 'inventario_global') + (S.filtroMes ? '_' + S.filtroMes : '') + '_' + todayStr() + '.xlsx');
}

window.addEventListener('load', () => { S.token ? arrancar() : vLogin(); });
</script>
