}
async function api(accion, datos) {

    let listo = false;
    try {
      await esperarLEMDC();
      if (window.LEMDC && S.token) { const u = LEMDC.usuario(); const em = emailDeToken(S.token); if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token); }
      listo = !!(window.LEMDC && LEMDC.usuario());
    } catch (e) { console.warn('SQL Connect sin sesión (' + accion + '), usando n8n:', e && e.message); }
    if (listo) {
      try {
        const j = await LEMDC.llamar(accion, d);
        if (j.error && j.error !== 'no_existe') { toast('⚠️ ' + (j.detalle || j.error)); const e = new Error(j.error); e.negocio = true; e.detalle = j.detalle; throw e; }
        return j;
      } catch (e) {
        if (e && e.negocio) throw e;
        if (!LECTURAS.has(accion)) { aviso('No se pudo confirmar "' + accion + '" (' + ((e && e.message) || 'sin respuesta') + '). Revisa el estado antes de volver a intentarlo.'); throw e; }
        console.warn('SQL Connect falló en la lectura ' + accion + ', usando n8n:', e && e.message);

}
async function apiN8n(accion, datos) {

  const j = await r.json();

  return j;
}

    '<div class="stat ' + (ef7 == null ? '' : ef7 >= 95 ? 'ok' : ef7 >= 90 ? 'warn' : 'bad') + '"><div class="k">Eficiencia de guisos · 7 días</div><div class="v num">' + (ef7 == null ? '—' : ef7 + '%') + '</div><div class="s">' + T.filter(s => (est(s).ef_7 || {}).guiso != null && est(s).ef_7.guiso < 90).length + ' tiendas por debajo de 90 %</div></div>' +
    '<div class="stat lem"><div class="k">Valor del stock · este mes</div><div class="v num">' + money(stock) + '</div><div class="s">' + conGen.length + ' de ' + T.length + ' tiendas con inventario general este mes</div></div>' +
    '<div class="stat ' + (esCierre ? 'warn' : '') + '"><div class="k">Cierre de mes</div><div class="v num">' + (esCierre ? contaronCierre + ' / ' + T.length : diasCierre + ' días') + '</div><div class="s">' + (esCierre ? 'tiendas con conteo de hoy, ' + fmtDia(p.fin_mes) : 'próximo cierre ' + fmtDia(p.fin_mes) + ' · el anterior (' + fmtDia(p.fin_mes_anterior) + ') lo contaron ' + contaronCierre + ' de ' + T.length) + '</div></div></div>';
  h += '<div class="tbl"><table><thead><tr><th>Tienda</th><th>Diario</th><th>Eficiencia 7 días</th><th>Inventario general</th><th>Alertas</th><th></th></tr></thead><tbody>' + T.map(s => { const e = est(s); const e7 = e.ef_7 || {}; const ug = e.ultimo_general; const nombre = corto(s.corto || s.nombre);
    const diario = e.sin_actividad ? '<span class="badge b-gris">Sin actividad</span>' + (e.ultimo_diario ? '<div class="hint">' + fmtFecha(e.ultimo_diario) + '</div>' : '') : (e.al_dia ? '<span class="badge b-ok">Al día</span><div class="hint">' + fmtDia(e.ultimo_diario) + '</div>' : '<span class="badge b-bad">Falta ' + fmtDia(e.dia_esperado) + '</span><div class="hint">último: ' + (e.ultimo_diario ? fmtDia(e.ultimo_diario) + (e.ultimo_diario_estado === 'autogenerado' ? ' (generado)' : '') : '—') + '</div>');
    const al = []; if (num(e.generados_mes)) al.push('<span class="badge b-warn">' + e.generados_mes + ' generado' + (e.generados_mes === 1 ? '' : 's') + ' este mes</span>'); if (ug && num(ug.sin_precio)) al.push('<span class="badge b-warn">' + ug.sin_precio + ' sin precio</span>'); if ((e7.postre != null && e7.postre < 90) || (e7.bebida != null && e7.bebida < 90)) al.push('<span class="badge b-bad">eficiencia baja</span>');
    const msg = 'Hola, ' + nombre + ': no se registró el inventario del ' + fmtFecha(e.dia_esperado) + ' en la app (o quedó generado en ceros). Por favor pasa los datos reales a administración para corregirlo.';
    return '<tr><td><b>' + esc(nombre) + '</b></td><td>' + diario + '</td><td><span style="display:flex;gap:4px;flex-wrap:wrap">' + CATS.map(k => efChip(e7[k], CAT_LABEL[k].slice(0, 1))).join('') + '</span></td><td>' + (ug ? '<b class="num">' + money(ug.total_valor) + '</b><div class="hint">' + fmtDia(ug.fecha) + (e.general_hoy ? ' (hoy)' : '') + '</div>' : '<span class="hint">sin conteo</span>') + '</td><td><span style="display:flex;gap:4px;flex-wrap:wrap">' + (al.join('') || '<span class="hint">—</span>') + '</span></td><td style="white-space:nowrap">' + (!e.al_dia && !e.sin_actividad ? '<a class="btn btn-sec btn-sm" target="_blank" rel="noopener" href="' + waLink(msg) + '">💬 WhatsApp</a> ' : '') + '<button class="btn btn-sec btn-sm" onclick="S.diario.branch=' + s.branch_id + ';S.diario.fecha=\'\';irTab(\'diario\')">Ver</button></td></tr>'; }).join('') + '</tbody></table></div>';
  const ag = p.autogenerados || [];
  h += '<div class="card"><div class="row"><h3 style="margin:0">Días generados sin captura' + (S.filtroMes ? ' · ' + S.filtroMes : ' · todos') + '</h3><div class="controls" style="margin:0"><input class="inp" type="month" value="' + esc(S.filtroMes) + '" onchange="S.filtroMes=this.value;vPanel()"><button class="btn btn-sec btn-sm" onclick="exportar(null)">📥 Excel global</button></div></div>' +
    (ag.length ? '<div class="lista" style="margin-top:10px">' + ag.slice(0, 40).map(a => '<div class="row" style="border-bottom:1px solid var(--border);padding:6px 0"><span>🏪 <b>' + esc(a.sucursal || '') + '</b> · ' + fmtFecha(a.fecha) + '</span><a class="btn btn-sec btn-sm" target="_blank" rel="noopener" href="' + waLink('Hola, no se registró el inventario de ' + (a.sucursal || '') + ' del ' + fmtFecha(a.fecha) + '. El sistema lo generó en ceros. Por favor pasar los datos reales a administración para corregirlo.') + '">💬 WhatsApp</a></div>').join('') + (ag.length > 40 ? '<div class="hint">…y ' + (ag.length - 40) + ' más</div>' : '') + '</div>' : '<div class="hint" style="margin-top:8px">Ninguno en este periodo.</div>') + '</div>';
  M().innerHTML = h;
}

/* ── VALOR DEL INVENTARIO ── */
async function vValor() {
  const hoy = todayStr(); if (!S.val.fecha) S.val.fecha = hoy;
  let h = '<div class="sec"><h2>💰 Valor del inventario</h2><p>Lo que hay en stock a precio de la OC según el inventario general de cada tienda. Si una tienda no contó ese día, se toma su último conteo anterior (⚠️).</p></div>' +
    '<div class="controls"><input class="inp" type="date" id="valFecha" value="' + esc(S.val.fecha) + '" max="' + hoy + '" onchange="S.val.fecha=this.value;vValor()"><button class="btn btn-sec" onclick="S.val.fecha=todayStr();vValor()">Hoy</button><button class="btn btn-sec" id="btnFinMes">Fin de mes anterior</button><button class="btn btn-primary" onclick="exportarValor()">📥 Excel</button></div>';
  M().className = 'main'; M().innerHTML = h + '<div class="loading">Cargando…</div>';
  const r = await api('inv_general_valor', { fecha: S.val.fecha }); S.val.data = r;
  if (r.error) { M().innerHTML = h + '<div class="vacio">' + esc(r.detalle || r.error) + '</div>'; return; }
  const G = r.grupos || []; const tot = {}; let total = 0, kg = 0, con = 0;
  const rows = (r.sucursales || []).map(s => { const c = !!s.fecha_conteo; if (c) con++; G.forEach(g => { tot[g] = (tot[g] || 0) + num((s.por_grupo || {})[g]); }); total += num(s.total_valor); kg += num(s.kg_guisos);
    return '<tr class="clic" onclick="S.gen.branch=' + s.branch_id + ';S.gen.fecha=\'' + (s.fecha_conteo || S.val.fecha) + '\';S.gen.abierto=null;irTab(\'contar\')"><td><b>' + esc(corto(s.sucursal)) + '</b></td><td>' + (c ? (s.exacto ? fmtDia(s.fecha_conteo) : '<span class="badge b-warn">⚠️ ' + fmtDia(s.fecha_conteo) + '</span>') : '<span class="hint">sin conteo</span>') + (num(s.sin_precio) ? ' <span class="badge b-warn">' + s.sin_precio + ' sin precio</span>' : '') + '</td>' + G.map(g => '<td class="n">' + (c ? money((s.por_grupo || {})[g] || 0) : '') + '</td>').join('') + '<td class="n"><b>' + (c ? money(s.total_valor) : '') + '</b></td><td class="n">' + (c ? fmt(s.kg_guisos) : '') + '</td></tr>'; }).join('');
  M().innerHTML = h + '<div class="grid"><div class="stat lem"><div class="k">Total en stock</div><div class="v num">' + money(total) + '</div><div class="s">' + con + ' de ' + (r.sucursales || []).length + ' tiendas con conteo</div></div><div class="stat"><div class="k">Kg de guisos</div><div class="v num">' + fmt(Math.round(kg * 1000) / 1000) + '</div><div class="s">al ' + fmtDia(r.fecha) + '</div></div></div>' +
    '<div class="tbl"><table><thead><tr><th>Tienda</th><th>Conteo</th>' + G.map(g => '<th class="n">' + esc(g) + '</th>').join('') + '<th class="n">Total</th><th class="n">Kg guisos</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td colspan="2">TOTAL</td>' + G.map(g => '<td class="n">' + money(tot[g] || 0) + '</td>').join('') + '<td class="n">' + money(total) + '</td><td class="n">' + fmt(Math.round(kg * 1000) / 1000) + '</td></tr></tfoot></table></div><p class="hint">Toca una tienda para ver o corregir su conteo.</p>';
  const b = $('btnFinMes'); if (b) b.onclick = () => { S.val.fecha = r.fin_mes_anterior; vValor(); };
}
function exportarValor() {
  const r = S.val.data; if (!r || !window.XLSX) { toast('No hay datos o la librería de Excel no cargó.'); return; }
  const G = r.grupos || []; const hdr = ['Tienda', 'Fecha del conteo', 'Exacto'].concat(G).concat(['Total', 'Kg guisos', 'Capturado por']);
  const filas = (r.sucursales || []).map(s => [corto(s.sucursal), s.fecha_conteo ? fmtFecha(s.fecha_conteo) : 'Sin conteo', s.fecha_conteo ? (s.exacto ? 'Sí' : 'No, último anterior') : ''].concat(G.map(g => num((s.por_grupo || {})[g]))).concat([num(s.total_valor), num(s.kg_guisos), s.capturado_por || '']));
  const ws = XLSX.utils.aoa_to_sheet([['Valor del inventario al', fmtFecha(r.fecha)], []].concat([hdr]).concat(filas)); ws['!cols'] = hdr.map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Valor inventario'); XLSX.writeFile(wb, 'valor_inventario_' + r.fecha + '.xlsx');
}

/* ── Excel del diario (13 columnas de la app) ── */
async function exportar(branch) {
  if (!window.XLSX) { toast('La librería de Excel no cargó; recarga la página.'); return; }
  const r = await api('inv_export', { branch_id: branch, mes: S.filtroMes || null });
  if (!r.filas.length) { toast('No hay datos'); return; }
  const hdr = ['Sucursal', 'Fecha', 'Producto', 'Unidad', 'Saldo Inicial', 'Entrada', 'Baño María', 'Refrigerador', 'Congelador', 'Saldo Final', 'Consumo Real', 'Dritzline', 'Df. Teórica', 'Diferencia (g)'];
  const ws = XLSX.utils.aoa_to_sheet([hdr].concat(r.filas)); ws['!cols'] = hdr.map(() => ({ wch: 14 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, (branch ? 'inventario_' + corto(sucNombre(branch)).replace(/\s+/g, '_') : 'inventario_global') + (S.filtroMes ? '_' + S.filtroMes : '') + '_' + todayStr() + '.xlsx');
}

window.addEventListener('load', () => { S.token ? arrancar() : vLogin(); });
</script>
