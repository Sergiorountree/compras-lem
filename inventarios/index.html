<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventarios · Grupo LEM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* ── Inventarios · diseño del mockup aprobado por Sergio el 16-sep-2026 (paleta suya; el morado del portal solo para navegación) ── */
:root { --font: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --ground: #F8FAFC; --surface: #FFFFFF; --text: #1F2937; --consulta: #F1F5F9; --captura: #FFF8DB; --captura-hdr: #FFF0B3; --input-border: #967015; --divider: #DCE2E9;
  --text-soft: #6B7280; --text-faint: #8A94A3; --band: #EEF2F7; --auto-hdr: #E7ECF2; --alert: #B91C1C; --alert-bg: #FEE2E2; --alert-line: #DC2626;
  --ok: #0E5A42; --ok-bg: #DAF1E9; --warn: #7A4B05; --warn-bg: #FCEFD5; --lem: #534AB7; --lem-dark: #3C3489; --lem-light: #EEEDFE; }
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); background: var(--ground); color: var(--text); font-size: 15px; line-height: 1.45; min-height: 100vh; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; line-height: inherit; }
a { color: var(--lem); }
.num { font-variant-numeric: tabular-nums; }
/* cabecera */
.topbar { background: var(--surface); border-bottom: 1px solid var(--divider); padding: 10px 16px; min-height: 59px; display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; position: sticky; top: 0; z-index: 60; }
.topbar h1 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.topbar h1 a { color: var(--text-soft); text-decoration: none; font-size: 15px; }
.topbar h1 em { font-style: normal; font-size: 15px; font-weight: 500; color: var(--text-soft); }
.topbar .der { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--consulta); color: var(--text-soft); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.pill.rol { background: var(--lem-light); color: var(--lem-dark); font-weight: 600; }
.pill select { border: none; background: transparent; font-weight: 600; color: inherit; max-width: 170px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--divider); background: var(--surface); color: var(--text); text-decoration: none; }
.btn:hover { background: var(--ground); }
.btn-primary { background: var(--lem); border-color: var(--lem); color: #fff; } .btn-primary:hover { background: var(--lem-dark); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; } .btn-ok:hover { background: #0B4A36; }
.btn-lg { padding: 12px 20px; font-size: 16px; border-radius: 10px; } .btn-sm { padding: 6px 11px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.solo-pc { display: flex; } .solo-tel { display: none; }
/* pestañas + indicadores */
.tabs-wrap { background: var(--surface); border-bottom: 1px solid var(--divider); position: sticky; top: 53px; z-index: 55; }
.tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; padding: 0 16px; max-width: 1320px; margin: 0 auto; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; } .tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; border: 0; background: transparent; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-soft); padding: 13px 12px; white-space: nowrap; }
.tab.on { color: var(--lem-dark); } .tab.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 3px; background: var(--lem); border-radius: 3px 3px 0 0; }
.kpis { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 8px 0; }
.kpis .ayer { font-size: 14px; color: var(--text-soft); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 11px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.racha { background: var(--lem); color: #fff; } .chip.racha small { font-weight: 400; opacity: .8; font-size: 13px; }
.chip.v, .b-ok { background: var(--ok-bg); color: var(--ok); } .chip.a, .b-warn { background: var(--warn-bg); color: var(--warn); } .chip.r, .b-alert, .b-bad { background: var(--alert-bg); color: var(--alert); } .chip.gris, .b-gris { background: var(--consulta); color: var(--text-soft); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.badge.mini { font-size: 12px; padding: 2px 8px; }
/* contenido */
.main { padding: 0 16px 48px; max-width: 1320px; margin: 0 auto; }   /* mismo ancho del mockup: centrado y legible en monitores grandes */
.main.con-barra { padding-bottom: 110px; }
.vista-hdr { padding: 18px 0 12px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; justify-content: space-between; }
.vista-hdr h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.vista-hdr p, .hint { font-size: 14px; color: var(--text-soft); } .vista-hdr p { margin-top: 2px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inp { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--divider); background: var(--surface); font-size: 14px; font-weight: 500; min-height: 38px; }
.inp:focus { outline: 2px solid var(--lem); outline-offset: 1px; }
.card { background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card > h3 { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; padding: 14px 16px; border-top: 4px solid var(--divider); }
.stat .k { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-soft); } .stat .v { font-size: 26px; font-weight: 700; margin: 4px 0 2px; } .stat .s { font-size: 13px; color: var(--text-soft); }
.stat.ok { border-top-color: var(--ok); } .stat.warn { border-top-color: #E0A82E; } .stat.bad { border-top-color: var(--alert-line); } .stat.lem { border-top-color: var(--lem); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nota { border-radius: 10px; padding: 11px 13px; font-size: 15px; margin-bottom: 12px; background: var(--lem-light); color: var(--lem-dark); }
.nota.warn { background: var(--warn-bg); color: var(--warn); } .nota.ok { background: var(--ok-bg); color: var(--ok); } .nota.bad { background: var(--alert-bg); color: var(--alert); }
.vacio { background: var(--surface); border: 1px dashed var(--divider); border-radius: 12px; padding: 28px; text-align: center; color: var(--text-soft); }
.loading { text-align: center; padding: 40px; color: var(--text-soft); }
.leyenda { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--text-soft); padding: 2px 0 12px; align-items: center; }
.leyenda span { display: inline-flex; align-items: center; gap: 7px; } .leyenda i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--divider); display: inline-block; }
/* tabla del registro (mockup) */
.tabla-caja { background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; overflow-x: auto; margin-bottom: 12px; }
table.registro { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1150px; background: var(--surface); }
.registro thead tr.banda th { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 9px 12px; text-align: center; color: var(--text-soft); background: var(--band); border-bottom: 1px solid var(--divider); border-left: 1px solid var(--divider); }
.registro thead tr.banda th:first-child { border-left: 0; text-align: left; }
.registro thead tr.banda th.g-captura { background: var(--captura-hdr); color: #7A5B0C; } .registro thead tr.banda th.g-consulta { background: var(--consulta); color: #4B5563; } .registro thead tr.banda th.g-auto { background: var(--auto-hdr); color: #4B5563; }
.registro thead tr.cols th { font-size: 14px; font-weight: 600; color: var(--text-soft); padding: 8px 10px; text-align: right; white-space: nowrap; background: var(--surface); border-bottom: 2px solid var(--divider); }
.registro thead tr.cols th:first-child { text-align: left; }
.registro thead tr.cols th.h-consulta { background: var(--consulta); color: #4B5563; } .registro thead tr.cols th.h-captura { background: var(--captura-hdr); color: #7A5B0C; }
.registro th.prod, .registro td.prod { position: sticky; left: 0; z-index: 3; background: var(--surface); text-align: left; width: 230px; min-width: 230px; border-right: 1px solid var(--divider); }
.registro thead th.prod { z-index: 5; }
.nombre { font-size: 16px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.unidad { font-size: 14px; font-weight: 400; color: var(--text-faint); margin-left: 6px; white-space: nowrap; }
.registro tbody td { padding: 9px 10px; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--divider); background: var(--surface); }
.registro tbody td.prod { padding: 9px 14px; } .registro tbody tr:last-child td { border-bottom: 0; }
.registro td.c-consulta { background: var(--consulta); color: var(--text); } .registro td.c-captura { background: var(--captura); font-size: 16px; font-weight: 500; } .registro td.c-auto { background: var(--surface); font-weight: 600; }
.cap-box { display: inline-block; min-width: 96px; padding: 7px 9px; border: 1.5px solid var(--input-border); border-radius: 7px; background: var(--surface); color: var(--text); font-size: 16px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.registro tr.cat td { font-size: 18px; font-weight: 700; background: var(--band); color: var(--text); padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--divider); border-top: 1px solid var(--divider); }
.registro tr.cat td.prod { position: sticky; left: 0; z-index: 3; background: var(--band); }
.registro td.dif { font-weight: 600; }
.registro td.dif.fuera { background: var(--alert-bg); color: var(--alert); font-weight: 700; font-size: 16px; box-shadow: inset 3px 0 0 var(--alert-line), inset -3px 0 0 var(--alert-line); }
.registro td.prod.fila-fuera { box-shadow: inset 4px 0 0 var(--alert-line); }
.flecha { font-size: 13px; margin-left: 2px; }
.registro tfoot td { padding: 11px 12px; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--band); border-top: 2px solid var(--divider); }
.registro tfoot td.prod { text-align: left; background: var(--band); position: sticky; left: 0; z-index: 3; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-soft); }
/* eficiencia del día */
.ef-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.ef-col { border: 1px solid var(--divider); border-radius: 10px; padding: 12px 14px; background: var(--consulta); }
.ef-col h4 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.ef-row { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 3px 0; } .ef-row span { color: var(--text-soft); font-size: 14px; } .ef-row b { font-variant-numeric: tabular-nums; }
.ef-pct { margin-top: 8px; display: inline-flex; padding: 4px 10px; border-radius: 7px; font-size: 16px; font-weight: 700; }
/* destacados: racha y productos problema */
.destacados { display: grid; gap: 12px; grid-template-columns: minmax(250px, 310px) 1fr; margin-bottom: 14px; align-items: start; } .destacados .card { margin-bottom: 0; }
.card.ef { margin-top: 18px; }
.racha-card { border-top: 4px solid var(--lem); }
.racha-num { display: flex; align-items: baseline; gap: 10px; font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.racha-num em { font-style: normal; font-size: 34px; } .racha-num span { font-size: 16px; font-weight: 600; color: var(--text-soft); }
.racha-sub { font-size: 15px; margin-top: 8px; } .racha-sub b { color: var(--lem-dark); }
.tira { display: flex; gap: 5px; margin-top: 14px; } .tira i { flex: 1; height: 28px; border-radius: 5px; display: block; border: 1px solid rgba(31,41,55,.10); }
.tira-lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-faint); margin-top: 6px; }
.pie { font-size: 13px; color: var(--text-soft); margin-top: 12px; line-height: 1.4; }
.prob-hdr { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.prob-hdr h3 { font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-soft); margin: 0; } .prob-hdr .dia-et { font-size: 14px; color: var(--text-faint); }
.prob-lista { display: grid; gap: 8px; }
.prob { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; padding: 10px 13px; border-radius: 10px; background: var(--alert-bg); border: 1px solid #F3C4C1; }
.prob .nm { font-size: 16px; font-weight: 600; } .prob .det { font-size: 14px; color: #7F2E2B; font-variant-numeric: tabular-nums; margin-top: 2px; }
.prob .cifra { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; } .prob .cifra b { display: block; font-size: 20px; font-weight: 700; color: var(--alert); line-height: 1.15; } .prob .cifra small { font-size: 13px; color: #7F2E2B; }
.prob-ok { background: var(--ok-bg); border: 1px solid #B7E0D2; color: var(--ok); padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; }
.prob-gris { background: var(--consulta); border: 1px solid var(--divider); color: var(--text-soft); padding: 14px; border-radius: 10px; font-size: 15px; }
.prob-resumen { font-size: 15px; color: var(--text-soft); margin-bottom: 2px; } .prob-resumen b { color: var(--alert); font-size: 16px; }
.prob-toggle { width: 100%; border: 1px dashed #E7A9A5; background: transparent; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--alert); cursor: pointer; padding: 11px 13px; display: flex; align-items: center; gap: 9px; text-align: left; }
.prob-toggle:hover { background: var(--alert-bg); }
/* historial y eficiencias (acordeones) */
.dias { display: grid; gap: 8px; }
.dia { background: var(--surface); border: 1px solid var(--divider); border-radius: 10px; overflow: hidden; }
.dia-hdr { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.dia-hdr:hover { background: var(--ground); } .dia-hdr.on { background: var(--band); }
.dia-hdr .f { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 9px; } .dia-hdr .chev { display: inline-block; color: var(--text-faint); font-size: 13px; transition: transform .15s ease; } .dia-hdr.on .chev { transform: rotate(90deg); }
.dia-hdr .sem { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dia-det { border-top: 1px solid var(--divider); padding: 14px; background: var(--ground); }
.det-hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; } .det-hdr h4 { font-size: 17px; font-weight: 700; } .det-hdr p { font-size: 14px; color: var(--text-soft); }
.mes-dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 8px; }
.mdia { border: 1px solid var(--divider); border-radius: 9px; padding: 8px 10px; background: var(--surface); } .mdia .d { font-size: 14px; font-weight: 600; color: var(--text-soft); text-transform: capitalize; }
.mdia .p { display: flex; gap: 4px; margin-top: 6px; } .mdia .p span { font-size: 13px; font-weight: 700; padding: 3px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; flex: 1; text-align: center; }
.mdia.gen { background: var(--consulta); border-style: dashed; } .mdia .sin { font-size: 13px; color: var(--alert); font-weight: 600; margin-top: 6px; }
/* inventario general (contar) */
.grp { background: var(--surface); border: 1px solid var(--divider); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.grp > button { width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; }
.grp > button b { font-size: 18px; font-weight: 700; } .grp > button .st { font-size: 14px; color: var(--text-soft); font-weight: 500; margin-left: 8px; } .grp > button .sub { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grp .items { border-top: 1px solid var(--divider); padding: 2px 16px 12px; background: var(--captura); }
.item { padding: 13px 0; border-bottom: 1px solid #E7DCB4; } .item:last-child { border-bottom: 0; }
.item-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.item .nm { font-size: 16px; font-weight: 600; } .item .tot { text-align: right; white-space: nowrap; } .item .tot b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; } .item .tot small { display: block; font-size: 14px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.ubic { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 190px)); gap: 8px 10px; margin-top: 10px; justify-content: start; }
.ubic label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; color: #7A5B0C; }
input.cap { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; width: 100%; padding: 9px 11px; background: var(--surface); color: var(--text); border: 1.5px solid var(--input-border); border-radius: 7px; min-height: 42px; }
input.cap:focus { outline: 2px solid var(--input-border); outline-offset: 1px; }
.ubic .cap-txt { font-size: 16px; font-weight: 600; padding: 9px 0; }
.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--divider); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: 0 -6px 20px rgba(31,41,55,.07); z-index: 70; }
.barra .t { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; } .barra .t small { display: block; font-size: 14px; font-weight: 400; color: var(--text-soft); }
/* tablas de administración */
.tbl { overflow-x: auto; border: 1px solid var(--divider); border-radius: 12px; background: var(--surface); margin-bottom: 12px; }
table.simple { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
.simple th { font-size: 13px; font-weight: 600; color: var(--text-soft); text-align: left; padding: 9px 12px; background: var(--band); border-bottom: 1px solid var(--divider); white-space: nowrap; }
.simple td { padding: 9px 12px; border-bottom: 1px solid var(--divider); vertical-align: middle; font-variant-numeric: tabular-nums; } .simple tr:last-child td { border-bottom: 0; }
.simple tfoot td { background: var(--band); font-weight: 700; } .simple tr.clic { cursor: pointer; } .simple tr.clic:hover td { background: var(--ground); }
td.n, th.n { text-align: right; }
/* login, modal, toast */
.login { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login .card { max-width: 360px; width: 100%; text-align: center; padding: 30px 24px; }
.login h2 { color: var(--lem); font-size: 20px; margin: 8px 0 4px; } .login p { color: var(--text-soft); font-size: 14px; margin-bottom: 14px; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(31,41,55,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
.modal-card { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; max-height: 86vh; overflow: auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; } .modal-card p { color: var(--text-soft); font-size: 15px; margin-bottom: 8px; }
.modal-card .acts { display: flex; gap: 8px; margin-top: 14px; } .modal-card .acts .btn { flex: 1; }
.toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 200; background: #1F2937; color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; max-width: 92%; box-shadow: 0 10px 32px rgba(0,0,0,.2); }
.aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 16px; }
.lista { display: grid; gap: 8px; }

    return '<tr class="clic" onclick="S.gen.branch=' + s.branch_id + ';S.gen.fecha=\'' + (s.fecha_conteo || S.val.fecha) + '\';S.gen.abierto=null;irTab(\'contar\')"><td><b>' + esc(corto(s.sucursal)) + '</b></td><td>' + (c ? (s.exacto ? fmtDia(s.fecha_conteo) : '<span class="badge mini b-warn">⚠️ ' + fmtDia(s.fecha_conteo) + '</span>') : '<span class="hint">sin conteo</span>') + (num(s.sin_precio) ? ' <span class="badge mini b-warn">' + s.sin_precio + ' sin precio</span>' : '') + '</td>' + G.map(g => '<td class="n">' + (c ? money((s.por_grupo || {})[g] || 0) : '') + '</td>').join('') + '<td class="n"><b>' + (c ? money(s.total_valor) : '') + '</b></td><td class="n">' + (c ? fmt3(s.kg_guisos) : '') + '</td></tr>'; }).join('');
  M().innerHTML = h + '<div class="grid"><div class="stat lem"><div class="k">Total en stock</div><div class="v num">' + money(total) + '</div><div class="s">' + con + ' de ' + (r.sucursales || []).length + ' tiendas con conteo</div></div><div class="stat"><div class="k">Kg de guisos</div><div class="v num">' + fmt3(Math.round(kg * 1000) / 1000) + '</div><div class="s">al ' + fmtDia(r.fecha) + '</div></div></div>' +
    '<div class="tbl"><table class="simple"><thead><tr><th>Tienda</th><th>Conteo</th>' + G.map(g => '<th class="n">' + esc(g) + '</th>').join('') + '<th class="n">Total</th><th class="n">Kg guisos</th></tr></thead><tbody>' + rows + '</tbody><tfoot><tr><td colspan="2">TOTAL</td>' + G.map(g => '<td class="n">' + money(tot[g] || 0) + '</td>').join('') + '<td class="n">' + money(total) + '</td><td class="n">' + fmt3(Math.round(kg * 1000) / 1000) + '</td></tr></tfoot></table></div><p class="hint">Toca una tienda para ver o corregir su conteo.</p>';
  const b = $('btnFinMes'); if (b) b.onclick = () => { S.val.fecha = r.fin_mes_anterior; vValor(); };
}
function exportarValor() {
  const r = S.val.data; if (!r || !window.XLSX) { toast('No hay datos o la librería de Excel no cargó.'); return; }
  const G = r.grupos || []; const hdr = ['Tienda', 'Fecha del conteo', 'Exacto'].concat(G).concat(['Total', 'Kg guisos', 'Capturado por']);
  const filas = (r.sucursales || []).map(s => [corto(s.sucursal), s.fecha_conteo ? fmtFecha(s.fecha_conteo) : 'Sin conteo', s.fecha_conteo ? (s.exacto ? 'Sí' : 'No, último anterior') : ''].concat(G.map(g => num((s.por_grupo || {})[g]))).concat([num(s.total_valor), num(s.kg_guisos), s.capturado_por || '']));
  const ws = XLSX.utils.aoa_to_sheet([['Valor del inventario al', fmtFecha(r.fecha)], []].concat([hdr]).concat(filas)); ws['!cols'] = hdr.map(() => ({ wch: 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Valor inventario'); XLSX.writeFile(wb, 'valor_inventario_' + r.fecha + '.xlsx');
}

/* ── Excel del diario (13 columnas de la app) ── */
async function exportar(branch) {
  if (!window.XLSX) { toast('La librería de Excel no cargó; recarga la página.'); return; }
  const r = await api('inv_export', { branch_id: branch, mes: S.filtroMes || null });
  if (!r.filas.length) { toast('No hay datos'); return; }
  const hdr = ['Sucursal', 'Fecha', 'Producto', 'Unidad', 'Saldo Inicial', 'Entrada', 'Baño María', 'Refrigerador', 'Congelador', 'Saldo Final', 'Consumo Real', 'Dritzline', 'Df. Teórica', 'Diferencia (g)'];
  const ws = XLSX.utils.aoa_to_sheet([hdr].concat(r.filas)); ws['!cols'] = hdr.map(() => ({ wch: 14 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, (branch ? 'inventario_' + corto(sucNombre(branch)).replace(/\s+/g, '_') : 'inventario_global') + (S.filtroMes ? '_' + S.filtroMes : '') + '_' + todayStr() + '.xlsx');
}

window.addEventListener('load', () => { S.token ? arrancar() : vLogin(); });
</script>
