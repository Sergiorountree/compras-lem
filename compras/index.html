import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

window.LEMDC = {

function uDet(u, q) { const k = String(u || 'PZA').toUpperCase(); const p = UNIDADES[k] || [String(u || 'unidad').toLowerCase(), String(u || 'unidades').toLowerCase()]; return Number(q) === 1 ? p[0] : p[1]; }

function tokExpira() { try { const b = S.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(atob(b + '==='.slice((b.length + 3) % 4))).exp * 1000; } catch (e) { return 0; } }

    if (!window.google || CLIENT_ID.indexOf('__') === 0) { aviso('No se cargó el botón de Google (revisa bloqueadores o recarga la página): no se puede confirmar tu cuenta.'); resolve(false); return; }
    const antes = emailDeToken(S.token || '') || ((window.LEMDC && LEMDC.usuario()) ? String(LEMDC.usuario().email || '').toLowerCase() : '');
    let cerrado = false;
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px';
    div.innerHTML = '<div class="card" style="max-width:440px;text-align:center"><b style="font-size:16px">Confirma tu cuenta de Google</b><p class="presu" style="margin:8px 0">' + esc(motivo) + '</p>' +
      '<div id="gbtnRe" style="display:flex;justify-content:center;margin:12px 0"></div><button class="btn sec mini" id="btnReNo">Cancelar</button></div>';
    document.body.appendChild(div);
    const fin = (okk) => { if (cerrado) return; cerrado = true; div.remove(); resolve(okk); };
    $('btnReNo').onclick = () => fin(false);
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true, hd: 'grupolem.com', login_hint: antes || undefined, callback: (resp) => {
      if (cerrado) return;
      const em = emailDeToken(resp.credential);
      if (antes && em !== antes) { const p = div.querySelector('.presu'); if (p) p.innerHTML = '<b style="color:var(--rojo)">Elige la cuenta ' + esc(antes) + '</b>: es con la que estás trabajando.'; return; }   // misma persona: nada cambia de usuario
      S.token = resp.credential; store.set(S.token); fin(true); } });
    google.accounts.id.renderButton($('gbtnRe'), { theme: 'filled_blue', size: 'large', text: 'continue_with', locale: 'es' });
  });
}

/* ── Bandeja de proveedores con calculadora (hoy Cadena de Comida; mig. 087, Sergio 6-oct-2026): en vez de renglón por renglón,

   general elegido y lo que pidió. El administrador ajusta "Autorizar" por renglón y puede agregar guisos que el gerente dejó

  const provs = [...new Set((q.lineas || []).filter(l => l.calculadora).map(l => l.proveedor_id))];
  const out = {};
  for (const p of provs) {
    let bc = null, calc = null;
    try { bc = await api('bandeja_calc', { req_id: q.req_id, proveedor_id: p }); } catch (e) { continue; }
    if (!bc.corrida) { try { calc = await api('calculadora', { branch_id: q.branch_id, proveedor_id: p }); } catch (e) { calc = null; } }
    if (!bc.corrida && (!calc || calc.bloqueo)) continue;   // sin corrida y sin inventario elegido: renglón por renglón, como antes
    out[p] = { corrida: bc.corrida, calc, filas: filasBandejaCalc(q, p, bc.corrida, calc) };

  BCALC[q.req_id] = out;
}
/* Une la calculadora (corrida o cálculo de hoy) con los renglones del pedido, por producto */

  const filas = [], vistos = new Set();

  fuente.forEach(l => {
    const pi = l.proveedor_insumo_id, r = req[pi] || null, guiso = l.promedio != null;
    let sug = null, fin = null;
    if (corrida) { sug = guiso ? l.sugerido : null; fin = l.final; }
    else if (guiso) { const prev = CALC.data; CALC.data = calc; try { sug = lineaCalc(l, l.inventario == null ? '' : l.inventario, 0, '').sug; } finally { CALC.data = prev; } }
    vistos.add(pi);
    // precio y presentación: los del renglón del pedido; si no está pedido, los vigentes del catálogo (como la OC), no los de la corrida
    const pr = corrida ? ((corrida.productos || {})[pi] || null) : null, base = r || pr || l;
    filas.push({ pi, insumo: l.insumo, concepto: l.concepto, guiso, fraccion: Number(base.fraccion || l.fraccion || 1), precio: Number((base.precio != null ? base.precio : l.precio) || 0),
                 presentacion: base.presentacion != null ? base.presentacion : l.presentacion, unidad: base.unidad != null ? base.unidad : l.unidad, activo: pr ? pr.activo !== false : true,

}

/* Recalcula costos y totales del bloque con lo que está en "Autorizar" (y marca lo que cambió respecto al gerente) */
function recalcBandejaCalc(reqId, p) {
  const info = (BCALC[reqId] || {})[p]; if (!info) return;

    const aut = inp ? Number(inp.value || 0) : (r ? Number(r.aprobada || 0) : 0);

    const tr = $('bc_' + reqId + '_' + f.pi); if (tr) tr.style.background = inp && aut !== sol ? '#fff7d6' : '';

/* Resoluciones del bloque con calculadora: igual a lo pedido = aprobar; 0 = quitar; otra cantidad = cambiar; nuevo > 0 = agregar */
function resolucionesCalc(reqId) {
  const res = [], malos = [];
  document.querySelectorAll('.calc-aut[data-req="' + reqId + '"]').forEach(inp => {
    const v = Number(inp.value === '' ? 0 : inp.value), sol = Number(inp.dataset.sol), linea = inp.dataset.linea;
    if (!Number.isFinite(v) || v < 0 || Math.round(v) !== v) { malos.push(inp); return; }
    if (linea) {
      if (v === sol) res.push({ req_linea_id: Number(linea), accion: 'aprobar' });
      else if (v === 0) res.push({ req_linea_id: Number(linea), accion: 'rechazar', motivo: 'Quitado por administración al revisar la calculadora' });
      else res.push({ req_linea_id: Number(linea), accion: 'modificar', cantidad: v });
    } else if (v > 0) res.push({ accion: 'agregar', proveedor_insumo_id: Number(inp.dataset.pi), cantidad: v });
  });
  return { res, malos };

  document.querySelectorAll('.linea-res[data-linea]').forEach(el => { if ($('r' + el.dataset.linea + 'a')) resoluciones.push({ req_linea_id: Number(el.dataset.linea), accion: 'rechazar', motivo: motivo.trim() }); });
  document.querySelectorAll('.calc-aut[data-req="' + reqId + '"]').forEach(inp => { if (inp.dataset.linea) resoluciones.push({ req_linea_id: Number(inp.dataset.linea), accion: 'rechazar', motivo: motivo.trim() }); });
  if (!resoluciones.length) { alert('No hay líneas pendientes.'); return; }
  btn.disabled = true;
  try { await api('resolver', { req_id: reqId, resoluciones }); }
  catch (e) { if (rechazoDelServidor(e)) btn.disabled = false; return; }
  app().innerHTML = nav() + '<div class="card ok-big">✗<p><b>Pedido rechazado completo.</b></p><p style="color:var(--txt2)">Motivo: ' + esc(motivo.trim()) + '</p><p style="margin-top:14px"><button class="btn sec" onclick="vBandeja()">Volver a la bandeja</button></p></div>';
}
async function autorizar(reqId, btn) {
  const resoluciones = [];
  document.querySelectorAll('.linea-res[data-linea]').forEach(el => {
    const id = Number(el.dataset.linea);
    const sel = $('r' + id + 'a'); if (!sel) return;
    const a = sel.value;
    if (a === 'aprobar') resoluciones.push({ req_linea_id: id, accion: 'aprobar' });
    else if (a === 'modificar') resoluciones.push({ req_linea_id: id, accion: 'modificar', cantidad: Number($('r' + id + 'c').value) });
    else resoluciones.push({ req_linea_id: id, accion: 'rechazar', motivo: $('r' + id + 'm').value });
  });
  const falta = resoluciones.find(r => r.accion === 'rechazar' && !r.motivo.trim());
  if (falta) { alert('Todo rechazo necesita motivo.'); return; }
  // mig. 087: renglones de la calculadora (Cadena de Comida)
  const rc = resolucionesCalc(reqId);
  if (rc.malos.length) { alert('Las cantidades a autorizar deben ser números enteros de 0 o más.'); rc.malos[0].focus(); return; }
  if (rc.res.length) {
    const cambios = rc.res.filter(x => x.accion !== 'aprobar'), agregados = rc.res.filter(x => x.accion === 'agregar').length, quitados = rc.res.filter(x => x.accion === 'rechazar').length;
    const totTxt = Object.keys(BCALC[reqId] || {}).map(pid => { const t = $('bct_' + reqId + '_' + pid); return t ? t.textContent : ''; }).join(' + ');
    const pie = $('btot_' + reqId);
    if (!confirm('¿Autorizar el pedido de Cadena de Comida por ' + totTxt + ' sin IVA?' + (pie ? ' (total del pedido con los demás proveedores: ' + pie.textContent + ')' : '') + (cambios.length ? '\n\nCambios respecto a lo que pidió el gerente: ' + (cambios.length - agregados - quitados) + ' cantidad(es) cambiada(s), ' + quitados + ' quitado(s), ' + agregados + ' agregado(s).' : '\n\nSin cambios: se autoriza tal como lo pidió el gerente.'))) return;
    resoluciones.push(...rc.res);
  }
  if (resoluciones.some(r => r.accion !== 'rechazar') && !(await asegurarToken('Al autorizar se manda el aviso de la orden de compra a Pablo y para eso hay que confirmar tu cuenta (Google la pide cada hora). Sin eso la orden no pasa a tránsito y la sucursal no la ve en Recibir.'))) return;
  btn.disabled = true;
  let r;
  try { r = await api('resolver', { req_id: reqId, resoluciones }); }
  catch (e) { if (rechazoDelServidor(e)) btn.disabled = false; return; }
  let h = '<div class="card ok-big">✅<p>Requisición resuelta.</p>' + (r.saltadas ? '<p style="color:var(--ambar)">⚠️ ' + r.saltadas + ' renglón(es) ya los había resuelto otro administrador: se dejaron como estaban. Revisa el pedido en su historial.</p>' : '');
  if (r.ocs.length) {
    h += '<p style="margin-top:8px">Órdenes de compra generadas:</p>';
    r.ocs.forEach(o => { h += '<p><a href="#oc-' + o.oc_id + '"><b>' + esc(o.folio) + '</b> — ' + esc(o.proveedor) + '</a> <span id="mail-' + o.oc_id + '" class="chip">📧 avisando a Pablo…</span></p>'; });
    setTimeout(() => r.ocs.forEach(async o => {
      const el = document.getElementById('mail-' + o.oc_id); if (!el) return;
      try { const m = await avisarPablo(o.oc_id); el.textContent = m.ok ? '📧 enviada a Pablo · en tránsito' : '⚠️ ' + (m.detalle || m.error); el.className = 'chip ' + (m.ok ? 'recibida' : 'rechazada'); }
      catch (e) { el.innerHTML = '⚠️ no se pudo avisar a Pablo: abre la orden y usa «📧 Avisar a Pablo»'; el.className = 'chip rechazada'; }
    }), 50);
  } else h += '<p>No se generaron OCs (todo rechazado o pendiente de otro asesor).</p>';
  h += '<p style="margin-top:14px"><button class="btn sec" onclick="vBandeja()">Volver a la bandeja</button></p></div>';
  app().innerHTML = nav() + h;
}

    h += '<div class="no-print" style="margin-top:14px"><div class="cat-h" style="margin-top:0">Historial</div>';
    d.eventos.forEach(e => { h += '<div class="evento"><span class="ts">' + fecha(e.ts) + '</span><div><b>' + esc(etq(e.evento)) + '</b> — ' + esc(e.usuario) + (e.despues && e.despues.nota ? '<div style="color:var(--txt2)">' + esc(e.despues.nota) + '</div>' : '') + '</div></div>'; });
    h += '</div>';
  }
  h += '</div>';
  app().innerHTML = h;
}
async function imprimirOC(id) { try { await api('marcar_oc', { oc_id: Number(id), accion_oc: 'pdf_descargado' }); } catch (e) {} window.print(); }
async function marcarOC(id, acc) { await api('marcar_oc', { oc_id: Number(id), accion_oc: acc }); vOC(id); }

async function guardarProveedor(pid) {
  const r = await api('admin_guardar_proveedor', { proveedor_id: pid, email_pedidos: $('pv_mail').value, email_cc: $('pv_cc').value });
  if (r.ok) { const p = CA.data.proveedores.find(x => x.proveedor_id === pid); p.email_pedidos = $('pv_mail').value; p.email_cc = $('pv_cc').value; $('pv_mail').style.borderColor = 'var(--verde)'; }
}
async function correoProveedor(id, btn) {
  btn.disabled = true; btn.textContent = '📧 Enviando…';
  try {
    const det = await api('detalle', { tipo: 'oc', id: Number(id) }); const html = (det.formato && det.formato.tipo === 'gepp') ? htmlOCGepp(det) : null;
    const r = await api('correo_oc', { oc_id: Number(id), destino: 'proveedor', html });
    if (r.ok) { alert('Orden enviada a ' + r.enviado_a + (r.cc ? ' con copia a ' + r.cc : '') + ' desde facturas@grupolem.com.'); vOC(id); }

  } catch (e) { alert('No se pudo enviar el correo. Revisa que el proveedor tenga correo de pedidos en 📦 Catálogo.'); btn.disabled = false; btn.textContent = '📧 Enviar al proveedor por correo'; }
}

/* ── Formato de OC de GEPP (Pepsi) ─────────────────────── */
function htmlOCGepp(d) {
  const f = d.formato || {}, sd = f.sucursal || {};
  const fechaOC = new Date(d.creada_el).toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const m2 = (n) => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const B = 'border:1px solid #222;padding:4px 6px;font-size:12px;';
  const box = (t, extra) => '<div style="border:1px solid #222;padding:5px 8px;font-size:12.5px;text-align:center;margin-bottom:5px;' + (extra || '') + '">' + t + '</div>';
  const lineas = (d.lineas || []).filter(l => Number(l.cantidad) > 0);
  let cajas = 0, total = 0, filas = '';
  lineas.forEach(l => {
    const lf = l.formato || {};
    const compra = Number(l.cantidad), piezas = compra * Number(l.fraccion || 1);
    const precio = lf.precio_pactado != null ? Number(lf.precio_pactado) : Number(l.precio || 0) * Number(l.fraccion || 1);
    const monto = precio * compra; cajas += compra; total += monto;
    filas += '<tr><td style="' + B + 'text-align:center;background:#dce6f1">' + esc(lf.sku || l.codigo || '') + '</td><td style="' + B + 'text-align:center;background:#dce6f1">' + esc(lf.sku || l.codigo || '') + '</td>' +
      '<td style="' + B + '">' + esc(lf.nombre || l.insumo) + (lf.sku ? '' : ' <span style="color:#c00;font-size:10px">(fuera del formato)</span>') + '</td>' +
      '<td style="' + B + 'text-align:center;font-weight:700">' + piezas + '</td><td style="' + B + '">' + esc(lf.presentacion || l.presentacion || '') + '</td>' +
      '<td style="' + B + 'text-align:center;font-weight:700;font-size:14px">' + compra + '</td><td style="' + B + 'text-align:center">' + esc(lf.unidad || 'CAJA') + '</td>' +
      '<td style="' + B + 'text-align:right">' + m2(precio) + '</td><td style="' + B + '"></td><td style="' + B + 'text-align:center">' + esc(lf.iva || (Number(l.tasa_iva) > 0 ? 'SI' : 'NO')) + '</td><td style="' + B + '"></td>' +
      '<td style="' + B + 'text-align:right">' + m2(monto) + '</td></tr>';
  });
  const th = (t) => '<th style="' + B + 'background:#8a8a8a;color:#fff;text-align:center;font-size:11px">' + t + '</th>';
  return '<div style="font-family:Arial,Helvetica,sans-serif;color:#111;max-width:980px;border:1px solid #222;padding:8px">' +
    '<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr>' +
    '<td style="width:90px;padding:4px"><div style="display:inline-block;background:#c0262d;color:#fff;font-weight:900;font-size:11px;line-height:1;padding:6px 6px;border-radius:3px">DOÑA<br>TOTA</div></td>' +
    '<td style="background:#bdd7ee;text-align:center;font-weight:800;font-size:20px;padding:8px">' + esc(f.titulo || 'ORDEN DE COMPRA DOÑA TOTA FRANQUICIAS') + '</td>' +
    '<td style="width:170px;background:#e6e6e6;text-align:center;font-weight:800;font-size:14px;padding:8px">FOLIO ' + esc(d.folio) + '</td></tr></table>' +
    '<table style="width:100%;border-collapse:collapse"><tr><td style="width:50%;vertical-align:top;padding:0 14px 0 4px">' +
      '<div style="text-align:center;font-weight:700;font-size:11px">DIAS DE PEDIDO</div>' +
      '<table style="width:100%;border-collapse:collapse;margin-bottom:5px"><tr><td style="' + B + 'text-align:center;width:50%">' + fechaOC + '</td><td style="' + B + 'text-align:center">' + esc(sd.dias_pedido || 'no especificado') + '</td></tr></table>' +
      box('<b style="font-size:19px">' + esc(sd.nombre_formato || d.sucursal) + '</b>') + box(esc(sd.linea_sucursal || 'SUCURSAL DOÑA TOTA ' + d.sucursal.toUpperCase())) +
      box(esc(sd.ciudad || 'CHIHUAHUA, CHIH')) + box(esc(sd.direccion || 'dirección no especificada')) + box('<b>' + esc(sd.contacto || 'GERENTE EN TURNO') + '</b>', 'background:#e6e6e6') +
    '</td><td style="width:50%;vertical-align:top;padding:0 4px">' +
      '<table style="width:100%;border-collapse:separate;border-spacing:0 5px;font-size:12.5px">' +
      '<tr><td style="text-align:right;padding-right:6px;white-space:nowrap"><b>NUD</b></td><td style="' + B + 'text-align:center;width:110px;font-weight:700">' + esc(sd.codigo_cliente || '—') + '</td><td style="font-size:11px;padding-left:6px">' + esc(f.nota_codigo || '') + '</td></tr>' +
      '<tr><td style="text-align:right;padding-right:6px">Nombre Comercial:</td><td colspan="2" style="' + B + 'text-align:center;font-weight:800;font-size:15px">' + esc(f.nombre_comercial || d.proveedor) + '</td></tr>' +
      '<tr><td style="text-align:right;padding-right:6px">Razón Social:</td><td colspan="2" style="' + B + 'text-align:center">' + esc(f.razon_social || d.proveedor) + '</td></tr>' +
      '<tr><td style="text-align:right;padding-right:6px">Correo:</td><td colspan="2" style="' + B + 'text-align:center">' + esc(f.correo || '') + '</td></tr>' +
      '<tr><td style="text-align:right;padding-right:6px">Dirección:</td><td colspan="2" style="' + B + 'text-align:center">' + esc(f.direccion || '') + '</td></tr>' +
      '<tr><td style="text-align:right;padding-right:6px">Dirigido a:</td><td colspan="2" style="' + B + 'text-align:center">' + esc(f.dirigido_a || '') + '</td></tr></table>' +
    '</td></tr></table>' +
    '<table style="width:100%;border-collapse:collapse;margin-top:10px"><tr>' + th('SKU<br>PROVEEDOR') + th('SKU') + th('NOMBRE DEL PRODUCTO') + th('Piezas') + th('Presentacion') + th('COMPRA') + th('UNIDAD DE<br>COMPRA') + th('PRECIO<br>PACTADO') + th('ÚLTIMO<br>PRECIO<br>FACTURA') + th('IVA') + th('VIGENCIA DEL<br>PRECIO') + th('MONTO TOTAL') + '</tr>' + filas +
    '<tr><td colspan="4" style="border:none"></td><td style="' + B + 'background:#bdd7ee;font-weight:700">Total de cajas</td><td style="' + B + 'background:#bdd7ee;text-align:center;font-weight:800">' + cajas + '</td><td colspan="4" style="border:none"></td>' +
    '<td style="border:none;text-align:right;font-size:11px;padding-right:6px">TOTAL DE COMPRA</td><td style="' + B + 'text-align:right;font-weight:800">' + m2(total) + '</td></tr></table>' +
    (lineas.length ? '' : '<div style="color:#c00;font-size:12px;margin-top:6px">Sin renglones con cantidad.</div>') +
    '</div>';
}

/* ── Recepción del gerente ─────────────────────────────── */
async function vRecibir() {
  app().innerHTML = nav() + '<div class="msg">Buscando pedidos en camino…</div>';
  const r = await api('ocs_por_recibir', { branch_id: S.branch });
  S.porRecibir = r.ocs || [];
  let h = nav() + '<div class="cat-h">Pedidos en camino (' + S.porRecibir.length + ')</div>';
  if (!S.porRecibir.length) h += '<div class="msg">No hay pedidos en camino. Cuando el asesor autorice y se mande al proveedor, aparecerán aquí.</div>';
  S.porRecibir.forEach(o => {
    const tot = o.lineas.length, comp = o.lineas.filter(l => Number(l.recibida) >= Number(l.cantidad)).length;
    h += '<div class="card" style="cursor:pointer" onclick="location.hash=\'recibir-' + o.oc_id + '\'"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      '<div><b style="font-size:17px">' + esc(o.proveedor) + '</b> <span class="chip ' + esc(o.estado) + '">' + esc(etq(o.estado)) + '</span><div style="font-size:12.5px;color:var(--txt2)">' + esc(o.folio) + ' · enviada ' + fecha(o.enviada_el) + '</div></div>' +
      '<div style="text-align:right"><b style="font-size:16px">' + tot + ' producto' + (tot === 1 ? '' : 's') + '</b>' + (comp ? '<div style="font-size:12px;color:var(--txt2)">' + comp + ' ya completos</div>' : '') + '</div></div>' +
      '<div style="margin-top:8px"><span class="btn mini">📥 Recibir</span></div></div>';
  });
  app().innerHTML = h;
}
async function vRecibirOC(id) {
  if (!S.porRecibir) { const r = await api('ocs_por_recibir', { branch_id: S.branch }); S.porRecibir = r.ocs || []; }
  const o = S.porRecibir.find(x => String(x.oc_id) === String(id));
  if (!o) { location.hash = 'recibir'; return; }
  let h = nav() + '<div class="card"><b style="font-size:18px">' + esc(o.proveedor) + '</b> <span class="chip ' + esc(o.estado) + '">' + esc(etq(o.estado)) + '</span><div style="font-size:13px;color:var(--txt2)">' + esc(o.folio) + '</div>' +
    '<div class="presu" style="margin-top:6px">Escribe cuánto <b>llegó hoy</b> de cada producto. Si llegó todo, usa el botón verde.</div></div><div class="card rec">';
  o.lineas.forEach(l => {
    const pend = Number(l.cantidad) - Number(l.recibida);
    const u = presInfo(l);
    h += '<div class="item"><div class="info"><div class="n">' + esc(l.insumo) + '</div><div class="d">Pediste <b>' + l.cantidad + ' ' + plural(u.tipo, l.cantidad) + '</b>' + (u.n > 1 ? ' (' + u.n + ' ' + u.det + ' c/u)' : '') + (Number(l.recibida) > 0 ? ' · ya recibiste ' + l.recibida : '') + '</div></div>' +
      (pend <= 0 ? '<span class="chip recibida">✔ completo</span>' :
        '<div style="text-align:right"><div class="d">llegaron</div><input type="number" min="0" max="' + pend + '" step="1" inputmode="numeric" value="' + pend + '" data-l="' + l.oc_linea_id + '" data-p="' + pend + '" oninput="pintarFalta(this)"><div class="d falta" id="f-' + l.oc_linea_id + '"></div></div>') + '</div>';
  });
  h += '</div><div class="card"><label style="font-size:13px;color:var(--txt2)">Nota (opcional: qué faltó, qué llegó mal)<input id="rec_nota" style="width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:15px;margin-top:4px" placeholder="Ej. faltaron 2 cajas de Pepsi 400"></label>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" style="background:var(--verde)" onclick="recibirTodo(' + o.oc_id + ', this)">✅ Llegó todo</button>' +
    '<button class="btn sec" onclick="guardarRecepcion(' + o.oc_id + ', this)">💾 Guardar lo que llegó</button><a class="btn sec" href="#recibir">Cancelar</a></div></div>';
  app().innerHTML = h;
}
function pintarFalta(inp) { const p = Number(inp.dataset.p), v = Number(inp.value || 0); const f = $('f-' + inp.dataset.l); if (v > p) { inp.value = p; f.textContent = ''; return; } f.textContent = v < p ? 'faltan ' + (p - v) : ''; }
function lineasRecepcion() { return Array.from(document.querySelectorAll('.rec input[type=number]')).map(i => ({ oc_linea_id: Number(i.dataset.l), recibida: Number(i.value || 0) })); }
async function recibirTodo(id, btn) { document.querySelectorAll('.rec input[type=number]').forEach(i => { i.value = i.dataset.p; }); await guardarRecepcion(id, btn); }
async function guardarRecepcion(id, btn) {
  const lineas = lineasRecepcion();
  if (!lineas.some(l => l.recibida > 0)) { alert('No has marcado nada como recibido.'); return; }
  const faltan = lineas.filter(l => { const i = document.querySelector('.rec input[data-l="' + l.oc_linea_id + '"]'); return Number(i.dataset.p) > l.recibida; }).length;
  if (faltan && !confirm('Quedan ' + faltan + ' producto' + (faltan === 1 ? '' : 's') + ' con faltante. ¿Guardar así? (podrás recibir el resto después)')) return;
  btn.disabled = true;
  S.porRecibir = null;   // pase lo que pase, al volver a esta pantalla se piden al servidor los pendientes reales (no los de antes de guardar)
  let r;
  try { r = await api('recibir_oc', { oc_id: id, lineas, nota: $('rec_nota').value }); }
  catch (e) { if (rechazoDelServidor(e)) btn.disabled = false; return; }
  S.porRecibir = null;
  app().innerHTML = nav() + '<div class="card ok-big">' + (r.completa ? '✅<p><b>Pedido recibido completo.</b></p>' : '📦<p><b>Recepción parcial guardada.</b></p><p>Lo que falte lo recibes después desde 📥 Recibir.</p>') +
    '<p style="margin-top:8px;color:var(--txt2)">Se generó la cuenta por pagar <b>' + esc(r.cxp.folio) + '</b> por ' + money(r.cxp.total) + ' (con IVA) para contabilidad.</p>' +
    '<p style="margin-top:14px"><a class="btn sec" href="#recibir">Volver a pedidos en camino</a></p></div>';
}

/* ── Por pagar (asesor / contabilidad) ─────────────────── */
async function vPorPagar() {
  app().innerHTML = nav() + '<div class="msg">Cargando cuentas por pagar…</div>';
  const r = await api('por_pagar');
  const lst = r.por_pagar || [];
  const pend = lst.filter(c => c.estado === 'pendiente'), conc = lst.filter(c => c.estado !== 'pendiente');
  const tot = (a) => a.reduce((x, c) => x + Number(c.total), 0);
  let h = nav() + '<div class="card"><b>Lo que debemos por lo recibido</b><div class="presu">Cada recepción de sucursal genera una cuenta por pagar. Amárrala a la factura (CFDI) del proveedor: el gasto real es el CFDI.</div>' +
    '<div style="display:flex;gap:16px;margin-top:8px"><div><div class="d" style="font-size:12px;color:var(--txt2)">Pendientes</div><b style="font-size:18px">' + money(tot(pend)) + '</b> <span style="color:var(--txt2)">(' + pend.length + ')</span></div>' +
    '<div><div class="d" style="font-size:12px;color:var(--txt2)">Conciliadas</div><b style="font-size:18px">' + money(tot(conc)) + '</b> <span style="color:var(--txt2)">(' + conc.length + ')</span></div></div></div>';
  if (!lst.length) h += '<div class="msg">Todavía no hay recepciones.</div>';
  const card = (c) => {
    let x = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><b style="font-size:16px">' + esc(c.proveedor) + '</b> · ' + esc(c.sucursal.replace(' Chihuahua', '')) + ' <span class="chip ' + esc(c.estado) + '">' + esc(etq(c.estado)) + '</span>' +
      '<div style="font-size:12.5px;color:var(--txt2)">' + esc(c.folio) + ' · de <a href="#oc-' + c.oc_id + '">' + esc(c.oc_folio) + '</a> · recibido ' + fecha(c.recibido_el) + ' por ' + esc(String(c.recibido_por).split('@')[0]) + (c.completa ? '' : ' · <span class="chip recibida_parcial">parcial</span>') + '</div></div>' +
      '<div style="text-align:right"><b style="font-size:17px">' + money(c.total) + '</b><div style="font-size:12px;color:var(--txt2)">' + money(c.subtotal) + ' + IVA ' + money(c.iva) + '</div></div></div>';
    if (c.estado === 'pendiente') {
      x += '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="cf-' + c.cxp_id + '" style="padding:8px;border:1px solid var(--borde);border-radius:8px;font-size:14px;max-width:100%">' +
        '<option value="">— Elegir factura (CFDI) —</option>' + (c.candidatos || []).map(k => '<option value="' + k.uuid + '">' + esc((k.serie || '') + (k.folio || '')) + ' · ' + String(k.fecha).slice(0, 10) + ' · ' + money(k.total) + (Math.abs(Number(k.dif)) < 1 ? ' ✔ cuadra' : ' (dif ' + money(k.dif) + ')') + '</option>').join('') + '</select>' +
        '<button class="btn mini" onclick="conciliar(' + c.cxp_id + ')">Amarrar</button>' + (!(c.candidatos || []).length ? '<span class="d" style="font-size:12px;color:var(--txt2)">sin facturas de este proveedor en la base todavía</span>' : '') + '</div>';
    } else if (c.cfdi) {
      x += '<div style="margin-top:8px;font-size:13px">Factura <b>' + esc((c.cfdi.serie || '') + (c.cfdi.folio || '')) + '</b> · ' + String(c.cfdi.fecha).slice(0, 10) + ' · ' + money(c.cfdi.total) + (Math.abs(Number(c.cfdi.total) - Number(c.total)) >= 1 ? ' <span class="chip rechazada">dif ' + money(Number(c.cfdi.total) - Number(c.total)) + '</span>' : ' <span class="chip recibida">cuadra</span>') +
        ' <button class="btn mini sec" onclick="desconciliar(' + c.cxp_id + ')">Desamarrar</button></div>';
    }
    return x + '</div>';
  };
  if (pend.length) { h += '<div class="cat-h">Pendientes de amarrar</div>'; pend.forEach(c => { h += card(c); }); }
  if (conc.length) { h += '<div class="cat-h">Conciliadas</div>'; conc.forEach(c => { h += card(c); }); }
  app().innerHTML = h;
}
async function conciliar(id) { const u = $('cf-' + id).value; if (!u) { alert('Elige la factura.'); return; } const r = await api('conciliar_cxp', { cxp_id: id, uuid: u }); if (r.error) alert(r.detalle || r.error); vPorPagar(); }
async function desconciliar(id) { if (!confirm('¿Desamarrar esta cuenta de la factura?')) return; await api('conciliar_cxp', { cxp_id: id, uuid: null }); vPorPagar(); }

/* ── Arranque ──────────────────────────────────────────── */
window.addEventListener('load', () => { S.token ? arrancar() : vLogin(); });
</script>
