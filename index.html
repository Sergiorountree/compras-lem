<script type="module">
/* SQL Connect: misma sesión de Firebase que los módulos (ver /compras/). */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDataConnect, mutationRef, executeMutation } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-data-connect.js";
const fbApp = initializeApp({"apiKey": "AIzaSyC1ycKtN1atpb1monWFIJqmR4X5vmpnNoo", "authDomain": "lem-erp.firebaseapp.com", "projectId": "lem-erp", "appId": "1:902179844288:web:e887a0886fa1188da2fd25"});
const fbAuth = getAuth(fbApp);
const dc = getDataConnect(fbApp, { connector: "api", location: "us-central1", service: "lem-api" });
let resolverListo; const listo = new Promise(r => { resolverListo = r; });
onAuthStateChanged(fbAuth, () => resolverListo());
window.LEMDC = {
  listo,
  usuario: () => fbAuth.currentUser,
  entrar: (idToken) => signInWithCredential(fbAuth, GoogleAuthProvider.credential(idToken)),
  salir: () => signOut(fbAuth).catch(() => {}),
  llamar: async (accion, datos) => {
    const r = await executeMutation(mutationRef(dc, "Accion", { accion, datos: JSON.stringify(datos || {}) }));
    return (r && r.data && r.data.r && r.data.r.r) || {};
  }
};

<script>
/* ── Portal con puerta de entrada (12-sep-2026, a petición de Sergio): primero la cuenta de Google,

const CLIENT_ID = '902179844288-c4ppk03u5ss2vdqvl0chfoghhedi9ape.apps.googleusercontent.com';
const API = 'https://rountree.app.n8n.cloud/webhook/compras-api';
const store = { get(){ try { return sessionStorage.getItem('lem_tok'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem('lem_tok', v); } catch(e){} }, del(){ try { sessionStorage.removeItem('lem_tok'); } catch(e){} } };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function emailDeToken(t) { try { return (JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || '').toLowerCase(); } catch (e) { return ''; } }
async function esperarLEMDC() {
  if (!window.LEMDC) await new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if (window.LEMDC || Date.now() - t0 > 4000) { clearInterval(iv); r(); } }, 50); });
  if (window.LEMDC) await Promise.race([LEMDC.listo, new Promise(r => setTimeout(r, 4000))]);
}
async function apiN8n(accion, datos) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, accion, datos: datos || {} }) });
  if (r.status === 401) { const e = new Error('401'); e.expirada = true; throw e; }
  return await r.json();
}
/* Punto de vista (mig. 097): la vista elegida viaja en datos.ver_como; si el servidor la rechaza, la página vuelve a la vista
   propia sin cerrar la sesión (punto-de-vista.js). Sin ese archivo, todo funciona igual en la vista propia. */
async function api(accion, datos) {
  const d = window.LEM_PV ? LEM_PV.datos(accion, datos) : datos;
  const j = await apiCruda(accion, d);
  if (window.LEM_PV && LEM_PV.rechazo(j)) return LEM_PV.pendiente();
  return j;
}
async function apiCruda(accion, datos) {
  try {
    await esperarLEMDC();
    if (window.LEMDC && S.token) {
      const u = LEMDC.usuario(); const em = emailDeToken(S.token);
      if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token);
    }
    if (window.LEMDC && LEMDC.usuario()) return await LEMDC.llamar(accion, datos);
  } catch (e) { console.warn('SQL Connect no disponible, usando n8n:', e && e.message); }
  return apiN8n(accion, datos);
}
const MODULOS = {
  compras:     { clase: 'compras',     ico: '🛒', titulo: 'Compras',     texto: 'Gestiona proveedores, pedidos de sucursal, órdenes de compra y recepciones.', href: '/compras/', boton: 'Ir a Compras →' },
  inventarios: { clase: 'inventarios', ico: '📦', titulo: 'Inventarios', texto: 'Conteos diarios de guisos, postres y bebidas por sucursal, eficiencia contra el POS y captura del día.', href: '/inventarios/', boton: 'Ir a Inventarios →' },
  nominas:     { clase: 'nomina',      ico: '👥', titulo: 'Nóminas',     texto: 'Pre-nómina semanal: captura del gerente, revisión y cierre de contabilidad, horas extra y nómina calculada.', href: '/nominas/', boton: 'Ir a Nóminas →' },
  ventas:      { clase: 'ventas',      ico: '🚦', titulo: 'Ventas',      texto: 'Semáforo diario de ventas por sucursal: presupuesto del día, avance del mes y proyección.', href: '/ventas/', boton: 'Ir a Ventas →' },
  /* Contabilidad (F0, 7-oct-2026): solo administración y contabilidad. La tarjeta sale solo si perfil.modulos trae 'contabilidad';

  contabilidad: { clase: 'contabilidad', ico: '📒', titulo: 'Contabilidad', texto: 'Cuánto debemos (estimado), ingresos por tienda y canal, cortes de caja y qué tan al día están los datos. Solo administración y contabilidad.', href: '/contabilidad/', boton: 'Ir a Contabilidad →' },
  /* Asistente (piloto, 22-oct-2026): chat de venta por tienda y fecha. No es un módulo de lem.usuarios_modulos: la tarjeta sale a

     del asistente vuelve a revisarlo y a cualquier otra cuenta le responde sin_acceso. */
  asistente:   { clase: 'asistente',   ico: '💬', titulo: 'Asistente',   texto: 'Pregunta por la venta en español: por tienda, por día o contra otro periodo. Las cifras salen de la base y se revisan antes de mostrarse.', href: '/asistente/', boton: 'Abrir el asistente →', etiqueta: 'Piloto' }
};
const ROLES_ASISTENTE = ['admin', 'asesor', 'contabilidad'];
function vLogin(msj) {
  $('hUser').innerHTML = 'ERP modular';
  $('app').innerHTML = '<div class="login"><div class="ico">🏢</div><h2>Grupo LEM</h2><p>' + esc(msj || 'Entra con tu cuenta @grupolem.com para ver tus módulos') + '</p><div id="gbtn" style="display:flex;justify-content:center"></div></div>';
  if (window.google) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true,
      error_callback: (e) => aviso('Google no pudo abrir la ventana de acceso (' + ((e && e.type) || 'desconocido') + '). Si tu navegador bloquea ventanas emergentes, permítelas para este sitio y reintenta.'),
      callback: (resp) => { S.token = resp.credential; store.set(S.token); arrancar(); } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es' });
  } else { setTimeout(() => vLogin(msj), 400); }
}
function aviso(t) { const d = document.createElement('div'); d.className = 'aviso'; d.textContent = t; $('app').prepend(d); }
function salir() { S.avGen = (S.avGen || 0) + 1; store.del(); S.token = null; S.perfil = null; if (window.LEM_PV) LEM_PV.salir(); if (window.LEMDC) LEMDC.salir(); vLogin('Sesión cerrada.'); }
function pintar(p) {
  S.avGen = (S.avGen || 0) + 1;   // descarta los avisos que venían en camino para la vista anterior
  const mods = (p.modulos || []).filter(m => MODULOS[m]);
  if (((p.permisos || {}).ventas || []).some(r => ROLES_ASISTENTE.includes(r))) mods.push('asistente');
  // Sergio (21-oct): el gerente tiene pocos módulos y ve sus avisos debajo de ellos; quien supervisa (cualquier rol distinto de
  // gerente en Inventarios o Nóminas: asesor, aprobador, admin…) los ve en su pestaña Avisos
  S.supervisa = ['inventarios', 'nominas'].some(m => ((p.permisos || {})[m] || []).some(r => r !== 'gerente'));
  $('hUser').innerHTML = esc(p.usuario) + '<button onclick="salir()">Salir</button>';
  if (!mods.length) { $('app').innerHTML = '<div class="msg">Tu cuenta no tiene ningún módulo asignado. Pide acceso al administrador.</div>'; if (window.LEM_PV) LEM_PV.iniciar({ api }); return; }
  /* #pvPortal: la barra "Punto de vista" (mig. 097). Solo aparece si el servidor dice que esta cuenta puede elegirlo (hoy, Sergio). */
  let h = '<div class="hola"><h2>Bienvenido</h2><p>Elige el módulo con el que vas a trabajar.</p></div><div id="pvPortal" style="margin:-6px 0 20px"></div>' +
          '<div class="tabs" id="tabs" style="display:none"><button class="tab on" data-t="mods" onclick="verTab(\'mods\')">Módulos</button><button class="tab" data-t="avisos" onclick="verTab(\'avisos\')">Avisos<span class="n" id="nAvisos">0</span></button></div>' +
          '<div id="tabMods"><div class="grid">';
  for (const k of ['compras', 'nominas', 'inventarios', 'ventas', 'contabilidad', 'asistente']) {
    if (!mods.includes(k)) continue; const m = MODULOS[k];
    h += '<div class="mod ' + m.clase + '">' + (m.etiqueta ? '<span class="etq">' + m.etiqueta + '</span>' : '') + '<div class="ico">' + m.ico + '</div><h3>' + m.titulo + '</h3><p>' + m.texto + '</p><a href="' + m.href + '">' + m.boton + '</a></div>';
  }
  $('app').innerHTML = h + '</div><div id="avisosGer" style="margin-top:26px"></div></div><div id="tabAvisos" hidden></div>';
  if (window.LEM_PV) LEM_PV.iniciar({ api, contenedor: 'pvPortal' });
  if (mods.includes('nominas') || mods.includes('inventarios')) cargarAvisos();
}
/* Avisos (mig. 113, Sergio 21-oct): cada quien lo suyo. Inventarios (guisos por acabarse, inventario diario atrasado, días sin captura)
   de las tiendas donde la cuenta tiene Inventarios, y Horario (102: gerente que descansa en fin de semana, horas sin cubrir) para admin,
   asesor y el gerente de la sucursal. Asesor y administración: pestaña Avisos; gerente: debajo de sus módulos, solo si tiene avisos.
   Sin la 113 se usan los avisos de horario de la 102 (solo admin y asesor). Si el servidor no da avisos a esta cuenta, no hay nada. */
const DIAS_AV = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
function verTab(t) {
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('tabMods').hidden = t !== 'mods'; $('tabAvisos').hidden = t !== 'avisos';
}
function fechaCorta(iso) { const p = String(iso || '').slice(0, 10).split('-'); const M = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return p.length === 3 ? Number(p[2]) + ' ' + M[Number(p[1]) - 1] : ''; }
function sumaDias(iso, n) { const d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function numTxt(n) { const x = Math.round(Number(n) * 10) / 10; return x.toLocaleString('es-MX'); }
function avisoInventario(suc, lista) {
  const chips = [], cuerpo = [];
  for (const a of lista) {
    const det = a.detalle || {};
    if (a.tipo === 'guisos_por_acabarse') {
      const ps = det.productos || [];
      chips.push('<span class="chip acab">Guisos por acabarse</span>');
      cuerpo.push('<div class="txt">' + ps.length + ' guiso' + (ps.length === 1 ? '' : 's') + ' con ' + numTxt(det.umbral_dias || 3.5) + ' días o menos de inventario al cierre del ' + fechaCorta(det.fecha) + '. Pide a tiempo.</div>' +
        '<div class="prods">' + ps.map(p => '<span title="' + esc('Quedan ' + numTxt(p.existencia) + ' ' + (p.unidad || '') + ' · consumo promedio ' + numTxt(p.consumo_prom) + ' ' + (p.unidad || '') + ' al día') + '">' + esc(p.producto) + ' · <b>' + numTxt(p.dias) + (Number(p.dias) === 1 ? ' día' : ' días') + '</b></span>').join('') + '</div>');
    } else if (a.tipo === 'inventario_atrasado') {
      chips.push('<span class="chip atr">Inventario atrasado</span>');
      cuerpo.push('<div class="txt">Falta el inventario diario del ' + fechaCorta(det.esperado) + '. El último registrado es del ' + fechaCorta(det.ultimo) + '.</div>');
    } else if (a.tipo === 'dias_sin_captura') {
      const fs = det.fechas || [];
      chips.push('<span class="chip gen">Días sin captura</span>');
      cuerpo.push('<div class="txt">' + fs.length + (fs.length === 1 ? ' día' : ' días') + ' de la última semana sin captura del gerente (se generaron en ceros): ' + fs.map(fechaCorta).join(', ') + '.</div>');
    }

  return '<div class="av"><div class="top"><span class="suc">' + esc(suc) + '</span>' + chips.join('') + '</div>' + cuerpo.join('<div style="height:8px"></div>') +
         '<div style="margin-top:8px"><a href="/inventarios/">Ver inventario →</a></div></div>';
}
function avisoHorario(a, semana) {
  const horas = (a.detalle && a.detalle.horas) || [];
  const det = a.tipo === 'horas_sin_cubrir' ? horas.slice(0, 8).map(x => DIAS_AV[x.dia] + ' ' + x.hora + ' h: ' + x.programadas + ' de ' + x.recomendadas).join(' · ') + (horas.length > 8 ? ' · y ' + (horas.length - 8) + ' más' : '') : '';
  return '<div class="av"><div class="top"><span class="suc">' + esc(a.sucursal) + '</span>' +

         '<span class="chip est">' + (semana ? esc(semana) + ' · ' : '') + (a.estado === 'definido' ? 'Horario definido' : 'Horario en borrador') + '</span></div>' +
         '<div class="txt">' + esc(a.texto) + '</div>' + (det ? '<div class="det">' + esc(det) + '</div>' : '') +

function porSucursal(lista) { const g = []; lista.forEach(a => { let x = g.find(y => y.b === a.branch_id); if (!x) g.push(x = { b: a.branch_id, suc: a.sucursal, l: [] }); x.l.push(a); }); return g; }
async function cargarAvisos() {
  const gen = S.avGen = (S.avGen || 0) + 1;   // si mientras tanto salió o entró otra cuenta, esta respuesta ya no se pinta
  let r; try { r = await api('portal_avisos', {}); } catch (e) { r = null; }
  if (r && (r.error === 'accion_desconocida' || r.error === 'sin_clasificar')) { try { r = await api('nom_avisos', {}); } catch (e) { return; } }   // sin la mig. 113
  if (gen !== S.avGen || !r || r.error || !Array.isArray(r.avisos) || !$('tabs')) return;

  const semDe = a => (r.semanas || []).find(s => String(s.lunes).slice(0, 10) === String(a.lunes).slice(0, 10));

  const conInv = r.inventarios === true, conHor = r.horario === undefined ? true : r.horario === true;   // la respuesta de la 102 solo trae horario
  let h = '';

    h += '<div class="secc">Inventarios</div>';
    if (!inv.length) h += '<div class="av" style="color:var(--txt2)">Sin avisos de inventario.</div>';
    porSucursal(inv).forEach(g => { h += avisoInventario(g.suc, g.l); });
  }
  if (conHor) h += '<div class="secc">Horario</div><p style="color:var(--txt2);font-size:14px;margin:0 0 4px">Gerentes que descansan en fin de semana y horarios definidos con horas a las que les faltan 2 o más personas según la venta.</p>';
  for (const s of (conHor ? (r.semanas || []) : [])) {
    const del = hor.filter(a => semDe(a) === s);
    h += '<div class="sem">' + esc(s.etiqueta) + ' · ' + fechaCorta(s.lunes) + ' – ' + fechaCorta(sumaDias(s.lunes, 6)) + '</div>';
    if (!del.length) { h += '<div class="av" style="color:var(--txt2)">Sin avisos.</div>'; continue; }
    del.forEach(a => { h += avisoHorario(a); });
  }
  $('tabAvisos').innerHTML = h;
}
async function arrancar() {
  $('app').innerHTML = '<div class="msg">Cargando tus módulos…</div>';
  try {
    const p = await api('perfil');
    if (p && p.error) { store.del(); S.token = null; if (window.LEMDC) LEMDC.salir(); vLogin(p.error === 'sin_acceso' ? 'Tu cuenta no tiene acceso al portal. Pide acceso al administrador.' : ('No se pudo cargar tu perfil: ' + (p.detalle || p.error))); return; }
    S.perfil = p; pintar(p);
  } catch (e) {
    store.del(); S.token = null; if (window.LEMDC) LEMDC.salir();
    vLogin(e && e.expirada ? 'Tu sesión expiró — vuelve a entrar.' : 'No se pudo conectar (' + ((e && e.message) || 'error') + '). Reintenta.');
  }
}
if (S.token) arrancar(); else vLogin();
</script>
