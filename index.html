<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Compras · Grupo LEM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --rojo:#B3282D; --rojo2:#8f1f23; --gris:#f4f4f5; --borde:#e4e4e7; --txt:#18181b; --txt2:#71717a; --verde:#15803d; --ambar:#b45309; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:var(--txt); font-size:16px; }
  header { background:var(--rojo); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  header h1 { font-size:17px; font-weight:700; }
  header .u { font-size:12px; opacity:.85; text-align:right; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:12px; padding-bottom:90px; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px; margin-bottom:10px; }
  .btn { display:inline-block; border:none; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; background:var(--rojo); color:#fff; }
  .btn:disabled { opacity:.45; }
  .btn.sec { background:#fff; color:var(--txt); border:1px solid var(--borde); }
  .btn.mini { padding:6px 10px; font-size:14px; }
  .chip { display:inline-block; font-size:12px; font-weight:600; border-radius:99px; padding:2px 10px; background:var(--gris); color:var(--txt2); }
  .chip.enviada,.chip.en_revision { background:#fef3c7; color:var(--ambar); }
  .chip.autorizada,.chip.aprobada,.chip.modificada { background:#dcfce7; color:var(--verde); }
  .chip.rechazada,.chip.cancelada { background:#fee2e2; color:var(--rojo); }
  .chip.enviada_proveedor,.chip.cerrada { background:#dbeafe; color:#1d4ed8; }
  .chip.recibida_parcial,.chip.pendiente { background:#fef3c7; color:var(--ambar); }
  .chip.recibida,.chip.conciliada { background:#dcfce7; color:var(--verde); }
  .rec input[type=number] { width:70px; height:42px; text-align:center; border:2px solid var(--borde); border-radius:10px; font-size:18px; font-weight:700; }
  .rec .falta { color:var(--rojo); font-weight:700; }
  .cat-h { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--txt2); margin:16px 4px 6px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--gris); }
  .item:last-child { border-bottom:none; }
  .item .info { flex:1; min-width:0; }
  .item .n { font-weight:600; font-size:15px; }
  .item .d { font-size:12.5px; color:var(--txt2); }
  .step { display:flex; align-items:center; gap:6px; }
  .step button { width:40px; height:40px; border-radius:10px; border:1px solid var(--borde); background:#fff; font-size:20px; font-weight:700; color:var(--rojo); cursor:pointer; }
  .step input { width:44px; height:40px; text-align:center; border:1px solid var(--borde); border-radius:10px; font-size:16px; font-weight:700; }
  .totalbar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--borde); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:100%; z-index:10; }
  .totalbar .t { font-size:14px; }
  .totalbar .t b { font-size:17px; display:block; }
  .presu { font-size:12.5px; color:var(--txt2); }
  .presu.rojo { color:var(--rojo); font-weight:700; }
  .buscador { width:100%; padding:11px 14px; border:1px solid var(--borde); border-radius:10px; font-size:16px; margin-bottom:4px; }
  .nav { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .msg { text-align:center; padding:40px 16px; color:var(--txt2); }
  .ok-big { text-align:center; padding:36px 16px; }
  .ok-big .f { font-size:26px; font-weight:800; color:var(--verde); margin:8px 0; }
  .evento { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--gris); font-size:14px; }
  .evento .ts { color:var(--txt2); font-size:12px; white-space:nowrap; }
  table.oc { width:100%; border-collapse:collapse; font-size:14px; }
  table.oc th, table.oc td { border:1px solid var(--borde); padding:6px 8px; text-align:left; }
  table.oc th { background:var(--gris); font-size:12.5px; }
  .der { text-align:right; }
  .linea-res { border:1px solid var(--borde); border-radius:10px; padding:10px; margin:8px 0; }
  .linea-res select, .linea-res input[type=number], .linea-res input[type=text] { padding:8px; border:1px solid var(--borde); border-radius:8px; font-size:15px; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:10px; }
  .form label { display:flex; flex-direction:column; font-size:12.5px; color:var(--txt2); gap:3px; }
  .form input:not([type=checkbox]), .form select { padding:9px; border:1px solid var(--borde); border-radius:8px; font-size:15px; color:var(--txt); }
  @media (max-width:520px) { .form { grid-template-columns:1fr; } }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:#fff; border:2px solid var(--borde); border-radius:14px; padding:22px 12px; text-align:center; cursor:pointer; min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:4px; font-family:inherit; }
  .tile:active { border-color:var(--rojo); }
  .tile .tn { font-size:17px; font-weight:700; color:var(--txt); }
  .tile .td { font-size:12.5px; color:var(--txt2); }
  .tile .tb { font-size:12px; font-weight:700; color:var(--rojo); }
  .tile.excedido { border-color:var(--rojo); }
  .tile .barra { width:100%; }
  .tile.off { opacity:.5; cursor:not-allowed; }
  .layout { display:block; }
  .resumen .res-row { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; padding:3px 0; }
  .resumen .res-row.total { font-weight:700; font-size:18px; border-top:1px solid var(--borde); margin-top:4px; padding-top:8px; }
  .barra { height:8px; background:var(--gris); border-radius:99px; overflow:hidden; margin:6px 0 2px; }
  .barra > div { height:100%; background:var(--verde); transition:width .2s; }
  .barra.ambar > div { background:var(--ambar); }
  .barra.rojo > div { background:var(--rojo); }
  .uchip { display:inline-block; background:#fff7ed; color:#9a3412; border:1px solid #fdba74; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:800; letter-spacing:.02em; }
  .item .lq { color:var(--rojo); font-weight:600; margin-top:3px; }
  .step { flex-direction:column; align-items:center; gap:2px; }
  .stepin { display:flex; align-items:center; gap:6px; }
  .steplbl { font-size:11px; color:var(--txt2); text-transform:uppercase; letter-spacing:.04em; }
  .item .d .sin { color:var(--txt); font-weight:600; }
  .item .d .con { color:var(--txt2); }
  @media (min-width: 900px) {
    main { max-width:1040px; }
    .layout { display:grid; grid-template-columns:1fr 310px; gap:16px; align-items:start; }
    .resumen { position:sticky; top:66px; }
  }
  @media (max-width: 899px) {
    .resumen { position:fixed; bottom:0; left:0; right:0; margin:0; border-radius:14px 14px 0 0; box-shadow:0 -2px 14px rgba(0,0,0,.10); padding:10px 14px; z-index:10; }
    .resumen .res-row { font-size:13px; padding:1px 0; }
    .resumen .res-row.total { font-size:16px; padding-top:5px; }
    main { padding-bottom:230px; }
  }
  .aviso { background:#fef3c7; border:1px solid #fcd34d; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  @media print {
    header, .no-print, .totalbar { display:none !important; }
    body { background:#fff; } main { padding:0; max-width:100%; }
    .card { border:none; }
  }
</style>
</head>
<body>
<header>
  <h1>🛒 Compras LEM</h1>
  <div class="u" id="hUser"></div>
</header>
<main id="app"><div class="msg">Cargando…</div></main>

<script>
const CLIENT_ID = '902179844288-c4ppk03u5ss2vdqvl0chfoghhedi9ape.apps.googleusercontent.com';
const API = 'https://rountree.app.n8n.cloud/webhook/compras-api';
const $ = (id) => document.getElementById(id);
const app = () => $('app');
function aviso(m) { let b = document.getElementById('avisoErr'); if (!b) { b = document.createElement('div'); b.id = 'avisoErr'; b.className = 'aviso'; b.style.cssText = 'position:sticky;top:52px;z-index:20;margin:8px'; document.body.insertBefore(b, document.querySelector('main')); } b.textContent = '⚠️ ' + m; }
window.addEventListener('error', (e) => aviso('Error en la página: ' + e.message));
const store = { get(){ try { return sessionStorage.getItem('lem_tok'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem('lem_tok', v); } catch(e){} }, del(){ try { store.del(); } catch(e){} } };
const S = { token: store.get() || null, branch: null, prov: null, vista: (function(){ try { return localStorage.getItem('lem_vista') || 'admin'; } catch(e){ return 'admin'; } })(), perfil: null, cat: null, carrito: {}, reqId: null, folio: null, t0: null };
const UNIDADES = { PZA: ['pieza', 'piezas'], PZ: ['pieza', 'piezas'], KG: ['kilo', 'kilos'], K: ['kilo', 'kilos'], PQ: ['paquete', 'paquetes'], PKT: ['paquete', 'paquetes'], ROL: ['rollo', 'rollos'], BOL: ['bolsa', 'bolsas'], L: ['litro', 'litros'], LT: ['litro', 'litros'], U: ['unidad', 'unidades'] };
function uDet(u, q) { const k = String(u || 'PZA').toUpperCase(); const p = UNIDADES[k] || [String(u || 'unidad').toLowerCase(), String(u || 'unidades').toLowerCase()]; return Number(q) === 1 ? p[0] : p[1]; }
function presInfo(i) {
  const p = String(i.presentacion || '').toLowerCase(); const n = Number(i.fraccion || 1);
  let tipo = 'pieza';
  if (p.startsWith('caja')) tipo = 'caja'; else if (p.includes('paq')) tipo = 'paquete'; else if (p.includes('kilo')) tipo = 'kilo'; else if (p.includes('rollo')) tipo = 'rollo'; else if (p.includes('bolsa')) tipo = 'bolsa';
  else if (n === 1 && String(i.unidad || '').toUpperCase().startsWith('K')) tipo = 'kilo';
  return { tipo, n, det: uDet(i.unidad, n) };
}
const PLURAL = { caja: 'cajas', paquete: 'paquetes', pieza: 'piezas', kilo: 'kilos', rollo: 'rollos', bolsa: 'bolsas' };
const plural = (t, q) => Number(q) === 1 ? t : (PLURAL[t] || t + 's');
function chipUnidad(i) { const u = presInfo(i); return '<span class="uchip">' + u.tipo.toUpperCase() + (u.n > 1 ? ' · ' + u.n + ' ' + u.det : '') + '</span>'; }
const conIva = (p, t) => Number(p || 0) * (1 + Number(t || 0) / 100);
const money = (n) => '$' + Number(n || 0).toLocaleString('es-MX', { maximumFractionDigits: 2 });
const fecha = (ts) => new Date(ts).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const ETQ = { generada: 'Generada', autorizada: 'Autorizada', enviada_proveedor: 'En tránsito', recibida_parcial: 'Recibida parcial', recibida: 'Recibida', cerrada: 'Cerrada', cancelada: 'Cancelada', pendiente: 'Pendiente', conciliada: 'Conciliada' };
const etq = (e) => ETQ[e] || e;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(accion, datos) {
  let r;
  try {
    r = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: S.token, accion, datos: datos || {} })
    });
  } catch (err) { aviso('Sin conexión con la API (' + err.message + '). Revisa tu internet y reintenta.'); throw err; }
  if (r.status === 401) { store.del(); S.token = null; vLogin('Tu sesión expiró — vuelve a entrar.'); throw new Error('401'); }
  const j = await r.json();
  if (j.error) { alert('⚠️ ' + (j.detalle || j.error)); throw new Error(j.error); }
  return j;
}

/* ── Login ─────────────────────────────────────────────── */
function vLogin(msj) {
  app().innerHTML = '<div class="msg" style="padding-top:70px">' +
    '<div style="font-size:46px">🛒</div><h2 style="color:var(--txt);margin:10px 0 4px">Compras Grupo LEM</h2>' +
    '<p style="margin-bottom:20px">' + esc(msj || 'Entra con tu cuenta @grupolem.com') + '</p>' +
    (CLIENT_ID.indexOf('__') === 0
      ? '<div class="aviso">Falta configurar el Client ID de Google (lo pone el administrador en el workflow de n8n).</div>'
      : '<div id="gbtn" style="display:flex;justify-content:center"></div>') + '</div>';
  if (CLIENT_ID.indexOf('__') !== 0 && window.google) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true,
      error_callback: (e) => aviso('Google no pudo abrir la ventana de acceso (' + ((e && e.type) || 'desconocido') + '). Si tu navegador bloquea ventanas emergentes, permítelas para este sitio y reintenta.'),
      callback: (resp) => {
        try { S.token = resp.credential; store.set(S.token); arrancar(); }
        catch (err) { aviso('Falló el arranque tras el login: ' + err.message); }
      }});
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es' });
  }
}

async function arrancar() {
  try {
    const p = await api('perfil');
    S.perfil = p;
    if (S.branch == null && p.sucursales.length) S.branch = p.sucursales[0].branch_id;
    $('hUser').innerHTML = esc(p.usuario) + (p.roles.includes('admin') ? '<br>' + selectorVista() : '');
    router();
  } catch (e) { if (e.message !== '401') aviso('No se pudo cargar tu perfil: ' + e.message); }
}

/* ── Vista (solo admin): ver como gerente / aprobador / admin ─ */
function esAdmin() { return S.perfil && S.perfil.roles.includes('admin'); }
function vista() { return esAdmin() ? S.vista : 'propia'; }
function cambiarVista(v) {
  S.vista = v; S.gerenteElegido = false; try { localStorage.setItem('lem_vista', v); } catch (e) {}
  S.cat = null; S.carrito = {}; S.reqId = null; S.folio = null; S.t0 = null;
  location.hash = (v === 'aprobador') ? 'bandeja' : 'captura';
  router();
}
function selectorVista() {
  if (!esAdmin()) return '';
  const op = (v, t) => '<option value="' + v + '"' + (S.vista === v ? ' selected' : '') + '>' + t + '</option>';
  return '<label style="font-size:12px;opacity:.9">Ver como <select onchange="cambiarVista(this.value)" style="font-size:13px;border-radius:6px;padding:3px 6px;border:none">' +
    op('admin', 'Administrador') + op('gerente', 'Gerente de sucursal') + op('aprobador', 'Asesor') + '</select></label>';
}

/* ── Router ────────────────────────────────────────────── */
function nav() {
  const p = S.perfil; const vw = vista();
  const esG = (vw === 'propia') ? (p.roles.includes('gerente')) : (vw !== 'aprobador');
  const esA = (vw === 'propia') ? (p.aprueba_proveedores.length > 0) : (vw !== 'gerente');
  let h = '<div class="nav no-print">';
  if (esG && p.sucursales.length) h += '<button class="btn mini sec" onclick="location.hash=\'captura\'">🛒 Pedir</button>' +
                                        '<button class="btn mini sec" onclick="location.hash=\'pedidos\'">📋 Mis pedidos</button>' +
                                        '<button class="btn mini sec" onclick="location.hash=\'recibir\'">📥 Recibir</button>';
  if (esA) h += '<button class="btn mini sec" onclick="location.hash=\'bandeja\'">✅ Bandeja</button><button class="btn mini sec" onclick="location.hash=\'historial\'">🕘 Historial</button><button class="btn mini sec" onclick="location.hash=\'porpagar\'">💵 Por pagar</button>';
  if (vw === 'admin') h += '<button class="btn mini sec" onclick="location.hash=\'catalogo\'">📦 Catálogo</button><button class="btn mini sec" onclick="location.hash=\'presupuestos\'">💰 Presupuestos</button>';
  if (vw === 'gerente' && S.gerenteElegido) h += '<button class="btn mini sec" onclick="S.gerenteElegido=false;S.cat=null;S.carrito={};location.hash=\'captura\';router()">↔ Otro gerente</button>';
  return h + '</div>';
}
function router() {
  const h = location.hash.slice(1) || ((vista() === 'aprobador' || (vista() === 'propia' && S.perfil.aprueba_proveedores.length)) ? 'bandeja' : 'captura');
  if (h === 'captura') vCaptura();
  else if (h === 'pedidos') vPedidos();
  else if (h === 'bandeja') vBandeja();
  else if (h === 'catalogo') vCatalogoAdmin();
  else if (h === 'historial') vHistorialAsesor();
  else if (h === 'presupuestos') vPresupuestosAdmin();
  else if (h === 'recibir') vRecibir();
  else if (h === 'porpagar') vPorPagar();
  else if (h.startsWith('recibir-')) vRecibirOC(h.slice(8));
  else if (h.startsWith('req-')) vDetalle('requisicion', h.slice(4));
  else if (h.startsWith('oc-')) vOC(h.slice(3));
  else vCaptura();
}
window.addEventListener('hashchange', () => S.perfil && router());

/* ── Captura del gerente ───────────────────────────────── */
function cambiarSuc(v) { S.branch = Number(v); S.prov = null; S.cat = null; S.carrito = {}; S.reqId = null; S.folio = null; S.t0 = null; vCaptura(); }
function vElegirGerente() {
  let h = nav() + '<div class="card"><b>¿Qué gerente quieres ser?</b><div class="presu" style="margin-bottom:8px">Verás exactamente lo que ve ese gerente: solo su sucursal.</div>';
  S.perfil.sucursales.forEach(s => {
    h += '<button class="btn sec" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="elegirGerente(' + s.branch_id + ')">' + esc(s.nombre) + '</button>';
  });
  app().innerHTML = h + '</div>';
}
function elegirGerente(b) { S.branch = Number(b); S.gerenteElegido = true; S.prov = null; S.cat = null; S.carrito = {}; S.reqId = null; S.folio = null; S.t0 = null; vCaptura(); }
async function vCaptura() {
  if (vista() === 'gerente' && !S.gerenteElegido) { vElegirGerente(); return; }
  const suc = S.perfil.sucursales.find(s => s.branch_id === S.branch) || S.perfil.sucursales[0];
  if (!suc) { app().innerHTML = nav() + '<div class="msg">Tu usuario no tiene sucursal asignada para pedir.</div>'; return; }
  if (!S.cat) {
    app().innerHTML = nav() + '<div class="msg">Cargando catálogo…</div>';
    S.cat = await api('catalogo', { branch_id: S.branch });
  }
  const selector = (S.perfil.sucursales.length > 1 && vista() !== 'gerente')
    ? '<select onchange="cambiarSuc(this.value)" style="font-size:16px;font-weight:700;border:1px solid var(--borde);border-radius:8px;padding:6px 8px;max-width:100%">' +
      S.perfil.sucursales.map(s => '<option value="' + s.branch_id + '"' + (s.branch_id === S.branch ? ' selected' : '') + '>' + esc(s.nombre) + '</option>').join('') + '</select>'
    : '<b>' + esc(suc.nombre) + '</b>';
  let h = '<div class="card">' + selector + '</div>';
  const prov = (S.cat.proveedores || []).find(p => p.proveedor_id === S.prov);
  if (!prov) {
    h += '<div class="cat-h">¿A quién le pides?</div><div class="grid2">';
    (S.cat.proveedores || []).forEach(p => {
      const n = Object.keys(S.carrito).filter(id => { const it = S.cat.catalogo.find(x => x.proveedor_insumo_id === Number(id)); return it && it.proveedor_id === p.proveedor_id; }).length;
      const sp = subPorProv()[p.proveedor_id] || { sub: 0 };
      const pres = p.presupuesto ? Number(p.presupuesto) : null;
      const activo = p.insumos > 0;
      const pct = pres ? Math.min(sp.sub / pres * 100, 100) : 0;
      h += '<button class="tile' + (activo ? '' : ' off') + (pres && sp.sub > pres ? ' excedido' : '') + '" ' + (activo ? 'onclick="abrirProv(' + p.proveedor_id + ')"' : 'disabled') + '>' +
        '<div class="tn">' + esc(p.nombre_corto) + '</div>' +
        '<div class="td">' + (p.insumos > 0 ? p.insumos + ' insumos' : 'catálogo pendiente') + '</div>' +
        (pres ? '<div class="td" style="margin-top:6px">Presupuesto ' + money(pres) + '</div><div class="barra' + (sp.sub > pres ? ' rojo' : (pct > 85 ? ' ambar' : '')) + '" style="margin:4px 0"><div style="width:' + pct + '%"></div></div><div class="td">' + (sp.sub ? money(sp.sub) + ' sin IVA' : 'sin pedido aún') + '</div>' : (p.insumos > 0 ? '<div class="td" style="margin-top:6px;color:var(--ambar)">sin presupuesto asignado</div>' : '')) +
        (n ? '<div class="tb">' + n + ' en el pedido</div>' : '') + '</button>';
    });
    h += '</div>';
  } else {
    const items = S.cat.catalogo.filter(i => i.proveedor_id === prov.proveedor_id);
    const grupos = {};
    items.forEach(i => { (grupos[i.concepto] = grupos[i.concepto] || []).push(i); });
    h += '<div style="display:flex;align-items:center;gap:10px;margin:8px 0 4px"><button class="btn mini sec" onclick="S.prov=null;vCaptura()">← Proveedores</button><b style="font-size:17px">' + esc(prov.nombre_corto) + '</b></div>' +
      '<input class="buscador no-print" id="busca" placeholder="Buscar en ' + esc(prov.nombre_corto) + '…" oninput="filtrar()">';
    for (const g in grupos) {
      h += '<div class="cat-h" data-cat="1">' + esc(g) + '</div><div class="card">';
      grupos[g].forEach(i => {
        const v = S.carrito[i.proveedor_insumo_id] || 0;
        const u = presInfo(i);
        const pPres = i.precio ? Number(i.precio) * u.n : null;

async function rechazarTodo(reqId, btn) {
  const motivo = prompt('¿Por qué se rechaza el pedido completo? (obligatorio)');

  if (!motivo.trim()) { alert('Escribe el motivo del rechazo.'); return; }
  const resoluciones = [];
  document.querySelectorAll('.linea-res[data-linea]').forEach(el => { if ($('r' + el.dataset.linea + 'a')) resoluciones.push({ req_linea_id: Number(el.dataset.linea), accion: 'rechazar', motivo: motivo.trim() }); });

  btn.disabled = true;
  await api('resolver', { req_id: reqId, resoluciones });
  app().innerHTML = nav() + '<div class="card ok-big">✗<p><b>Pedido rechazado completo.</b></p><p style="color:var(--txt2)">Motivo: ' + esc(motivo.trim()) + '</p><p style="margin-top:14px"><button class="btn sec" onclick="vBandeja()">Volver a la bandeja</button></p></div>';
}
async function autorizar(reqId, btn) {
  const resoluciones = [];
  document.querySelectorAll('.linea-res[data-linea]').forEach(el => {
    const id = Number(el.dataset.linea);
    const sel = $('r' + id + 'a'); if (!sel) return;
    const a = sel.value;
    if (a === 'aprobar') resoluciones.push({ req_linea_id: id, accion: 'aprobar' });
    else if (a === 'modificar') resoluciones.push({ req_linea_id: id, accion: 'modificar', cantidad: Number($('r' + id + 'c').value) });
    else resoluciones.push({ req_linea_id: id, accion: 'rechazar', motivo: $('r' + id + 'm').value });
  });
  const falta = resoluciones.find(r => r.accion === 'rechazar' && !r.motivo.trim());
  if (falta) { alert('Todo rechazo necesita motivo.'); return; }
  btn.disabled = true;
  const r = await api('resolver', { req_id: reqId, resoluciones });
  let h = '<div class="card ok-big">✅<p>Requisición resuelta.</p>';
  if (r.ocs.length) {
    h += '<p style="margin-top:8px">Órdenes de compra generadas:</p>';
    r.ocs.forEach(o => { h += '<p><a href="#oc-' + o.oc_id + '"><b>' + esc(o.folio) + '</b> — ' + esc(o.proveedor) + '</a> <span id="mail-' + o.oc_id + '" class="chip">📧 avisando a Pablo…</span></p>'; });
    setTimeout(() => r.ocs.forEach(async o => {
      const el = document.getElementById('mail-' + o.oc_id); if (!el) return;
      try { const m = await api('correo_oc', { oc_id: o.oc_id, destino: 'pablo' }); el.textContent = m.ok ? '📧 aviso enviado a Pablo' : '⚠️ ' + (m.detalle || m.error); el.className = 'chip ' + (m.ok ? 'recibida' : 'rechazada'); }
      catch (e) { el.textContent = '⚠️ no se pudo avisar a Pablo'; el.className = 'chip rechazada'; }
    }), 50);
  } else h += '<p>No se generaron OCs (todo rechazado o pendiente de otro asesor).</p>';
  h += '<p style="margin-top:14px"><button class="btn sec" onclick="vBandeja()">Volver a la bandeja</button></p></div>';
  app().innerHTML = nav() + h;
}

  if (faltan && !confirm('Quedan ' + faltan + ' producto' + (faltan === 1 ? '' : 's') + ' con faltante. ¿Guardar así? (podrás recibir el resto después)')) return;

  const tot = (a) => a.reduce((x, c) => x + Number(c.total), 0);
  let h = nav() + '<div class="card"><b>Lo que debemos por lo recibido</b><div class="presu">Cada recepción de sucursal genera una cuenta por pagar. Amárrala a la factura (CFDI) del proveedor: el gasto real es el CFDI.</div>' +
    '<div style="display:flex;gap:16px;margin-top:8px"><div><div class="d" style="font-size:12px;color:var(--txt2)">Pendientes</div><b style="font-size:18px">' + money(tot(pend)) + '</b> <span style="color:var(--txt2)">(' + pend.length + ')</span></div>' +
    '<div><div class="d" style="font-size:12px;color:var(--txt2)">Conciliadas</div><b style="font-size:18px">' + money(tot(conc)) + '</b> <span style="color:var(--txt2)">(' + conc.length + ')</span></div></div></div>';
  if (!lst.length) h += '<div class="msg">Todavía no hay recepciones.</div>';
  const card = (c) => {
    let x = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><b style="font-size:16px">' + esc(c.proveedor) + '</b> · ' + esc(c.sucursal.replace(' Chihuahua', '')) + ' <span class="chip ' + esc(c.estado) + '">' + esc(etq(c.estado)) + '</span>' +
      '<div style="font-size:12.5px;color:var(--txt2)">' + esc(c.folio) + ' · de <a href="#oc-' + esc(String(c.oc_folio)).replace(/.*/, '') + '">' + esc(c.oc_folio) + '</a> · recibido ' + fecha(c.recibido_el) + ' por ' + esc(String(c.recibido_por).split('@')[0]) + (c.completa ? '' : ' · <span class="chip recibida_parcial">parcial</span>') + '</div></div>' +
      '<div style="text-align:right"><b style="font-size:17px">' + money(c.total) + '</b><div style="font-size:12px;color:var(--txt2)">' + money(c.subtotal) + ' + IVA ' + money(c.iva) + '</div></div></div>';
    if (c.estado === 'pendiente') {
      x += '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="cf-' + c.cxp_id + '" style="padding:8px;border:1px solid var(--borde);border-radius:8px;font-size:14px;max-width:100%">' +
        '<option value="">— Elegir factura (CFDI) —</option>' + (c.candidatos || []).map(k => '<option value="' + k.uuid + '">' + esc((k.serie || '') + (k.folio || '')) + ' · ' + String(k.fecha).slice(0, 10) + ' · ' + money(k.total) + (Math.abs(Number(k.dif)) < 1 ? ' ✔ cuadra' : ' (dif ' + money(k.dif) + ')') + '</option>').join('') + '</select>' +
        '<button class="btn mini" onclick="conciliar(' + c.cxp_id + ')">Amarrar</button>' + (!(c.candidatos || []).length ? '<span class="d" style="font-size:12px;color:var(--txt2)">sin facturas de este proveedor en la base todavía</span>' : '') + '</div>';
    } else if (c.cfdi) {
      x += '<div style="margin-top:8px;font-size:13px">Factura <b>' + esc((c.cfdi.serie || '') + (c.cfdi.folio || '')) + '</b> · ' + String(c.cfdi.fecha).slice(0, 10) + ' · ' + money(c.cfdi.total) + (Math.abs(Number(c.cfdi.total) - Number(c.total)) >= 1 ? ' <span class="chip rechazada">dif ' + money(Number(c.cfdi.total) - Number(c.total)) + '</span>' : ' <span class="chip recibida">cuadra</span>') +
        ' <button class="btn mini sec" onclick="desconciliar(' + c.cxp_id + ')">Desamarrar</button></div>';
    }
    return x + '</div>';
  };
  if (pend.length) { h += '<div class="cat-h">Pendientes de amarrar</div>'; pend.forEach(c => { h += card(c); }); }
  if (conc.length) { h += '<div class="cat-h">Conciliadas</div>'; conc.forEach(c => { h += card(c); }); }
  app().innerHTML = h;
}
async function conciliar(id) { const u = $('cf-' + id).value; if (!u) { alert('Elige la factura.'); return; } const r = await api('conciliar_cxp', { cxp_id: id, uuid: u }); if (r.error) alert(r.detalle || r.error); vPorPagar(); }
async function desconciliar(id) { if (!confirm('¿Desamarrar esta cuenta de la factura?')) return; await api('conciliar_cxp', { cxp_id: id, uuid: null }); vPorPagar(); }

/* ── Arranque ──────────────────────────────────────────── */
window.addEventListener('load', () => { S.token ? arrancar() : vLogin(); });
</script>
</body>
